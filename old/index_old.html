   NORMALIZAÇÃO
   ===================================================================== */
function normalizeIgreja(v) {
  if (!v) return "";
  const s = String(v).toLowerCase();
  if (s.includes("cavallari")) return "IPI Cavallari";
  if (s.includes("vera cruz")) return "Congregação Vera Cruz";
  return String(v).trim();
}
function normalizeSituacao(v) {
  if (!v) return "";
  const s = String(v).toLowerCase().trim();
  if (s.startsWith("ativ")) return "Ativo";
  if (s.startsWith("inativ")) return "Inativo";
  return String(v).trim();
}
function normalizeTipoMembro(v) {
  if (!v) return "";
  const s = String(v).toLowerCase();
  if (s.includes("não profess") || s.includes("nao profess")) return "Não professos";
  if (s.includes("frequent")) return "Frequentes";
  if (s.includes("maior")) return "Maior";
  return String(v).trim();
}
function normalizeRecebidoPor(v) {
  if (!v) return "";
  const s = String(v).toLowerCase();
  const hasBatismo = s.includes("batismo");
  const hasProfissao = s.includes("profiss");
  if (hasBatismo && hasProfissao) return "Batismo e Profissão de Fé";
  if (s.includes("transfer")) return "Transferência";
  if (s.includes("jurisdi")) return "Jurisdição";
  if (hasBatismo) return "Batismo";
  if (s.includes("frequent")) return "Frequentes";
  return String(v).trim();
}
function normalizeSexo(v) {
  if (!v) return "";
  const s = String(v).toLowerCase().trim();
  if (s.includes("homem") || s.startsWith("masc") || s === "m") return "Masculino";
  if (s.includes("mulher") || s.startsWith("fem") || s === "f") return "Feminino";
  return String(v).trim();
}
function normalizeName(v) {
  return String(v || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ");
}
function isEligibleForMembroProfesso(m) {
  const age = getAge(m.dt_nascimento);
  return m.situacao_membro === "Ativo" && m.status_membro === "Maior" && age !== null && age < 18;
}
function memberMatchesTipo(m, tipo) {
  return m.status_membro === tipo;
}

function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(d) {
  if (!d) return "—";
  const parts = String(d).split("-");
  if (parts.length !== 3) return d;
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}
function getAge(dob) {
  if (!dob) return null;
  const b = new Date(dob);
  if (isNaN(b)) return null;
  const t = new Date();
  let age = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
  return age;
}
function showToast(msg, isErr) {
  state.toast = { msg, isErr };
  render();
  setTimeout(() => { state.toast = null; render(); }, 3200);
}
function renderChipGroup(group, options, selected) {
  return options.map((o) => '<button type="button" class="chip-toggle ' + (selected.includes(o) ? "active" : "") + '" data-chipgroup="' + group + '" data-chipvalue="' + esc(o) + '">' + esc(o) + "</button>").join("");
}

async function initAuth() {
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  state.loadingSession = false;
  render();
  if (state.session) { await bootstrapData(); startIdleWatcher(); }

  sb.auth.onAuthStateChange(async (_event, session) => {
    state.session = session;
    render();
    if (session) { await bootstrapData(); startIdleWatcher(); }
    else clearTimeout(idleTimer);
  });
}

/* =====================================================================
   LOGOUT AUTOMATICO POR INATIVIDADE (20 minutos)
   ===================================================================== */
const IDLE_LIMIT_MS = 20 * 60 * 1000;
let idleTimer = null;
let idleWatcherStarted = false;
function resetIdleTimer() {
  if (!state.session) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (state.session) handleLogout();
  }, IDLE_LIMIT_MS);
}
function startIdleWatcher() {
  if (idleWatcherStarted) { resetIdleTimer(); return; }
  idleWatcherStarted = true;
  ["mousedown", "mousemove", "keydown", "scroll", "touchstart", "click"].forEach((evt) => {
    document.addEventListener(evt, resetIdleTimer, { passive: true });
  });
  resetIdleTimer();
}
async function bootstrapData() {
  await Promise.all([fetchMembers(), fetchVinculos(), fetchAgenda()]);
  await ensureDefaultAcolher();
  await ensureMembroProfesso();
}
async function handleLogin(email, password) {
  state.loggingIn = true; state.loginError = ""; render();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  state.loggingIn = false;
  if (error) state.loginError = error.message === "Invalid login credentials" ? "E-mail ou senha invalidos." : error.message;
  render();
}
async function handleLogout() { clearTimeout(idleTimer); await sb.auth.signOut(); }

async function fetchMembers() {
  state.loadingMembers = true; render();
  const { data, error } = await sb.from(TABLE).select("*").order("nome_completo", { ascending: true });
  state.loadingMembers = false;
  if (error) { showToast("Erro ao carregar membros: " + error.message, true); state.members = []; }
  else {
    state.members = (data || []).map((m) => ({
      ...m,
      membresia_igreja: normalizeIgreja(m.membresia_igreja),
      situacao_membro: normalizeSituacao(m.situacao_membro),
      status_membro: normalizeTipoMembro(m.status_membro),
      recebido_por: normalizeRecebidoPor(m.recebido_por),
      sexo: normalizeSexo(m.sexo),
    }));
  }
  render();
}
async function saveMember(payload, id) {
  state.saving = true; render();
  let error;
  if (id) ({ error } = await sb.from(TABLE).update(payload).eq("id", id));
  else ({ error } = await sb.from(TABLE).insert(payload));
  state.saving = false;
  if (error) { showToast("Erro ao salvar: " + error.message, true); render(); return false; }
  showToast(id ? "Membro atualizado." : "Membro cadastrado.");
  state.modalOpen = false; state.editingMember = null;
  await fetchMembers();
  await ensureDefaultAcolher();
  await ensureMembroProfesso();
  return true;
}
async function deleteMember(id, name) {

  const { error } = await sb.from(TABLE).delete().eq("id", id);

}

async function fetchVinculos() {
  state.loadingVinculos = true; render();
  const [minRes, procRes] = await Promise.all([
    sb.from(MIN_TABLE).select("*"),
    sb.from(PROC_TABLE).select("*"),
  ]);
  state.loadingVinculos = false;
  if (minRes.error) showToast("Erro ao carregar ministerios: " + minRes.error.message, true);
  else state.vinculosMinisterios = minRes.data || [];
  if (procRes.error) showToast("Erro ao carregar processos: " + procRes.error.message, true);
  else state.vinculosProcessos = procRes.data || [];
  render();
}
async function ensureDefaultAcolher() {
  const withProcess = new Set(state.vinculosProcessos.map((v) => v.membro_id));
  const missing = state.members.filter((m) => !withProcess.has(m.id));
  if (missing.length === 0) return;
  const rows = missing.map((m) => ({ membro_id: m.id, processo: "Acolher" }));
  const { data, error } = await sb.from(PROC_TABLE).insert(rows).select();
  if (error) { showToast("Erro ao definir Acolher padrao: " + error.message, true); return; }
  state.vinculosProcessos = state.vinculosProcessos.concat(data || []);
  render();
}
async function ensureMembroProfesso() {
  const toUpdate = state.members.filter((m) => isEligibleForMembroProfesso(m));
  if (toUpdate.length === 0) return;
  const ids = toUpdate.map((m) => m.id);
  const { error } = await sb.from(TABLE).update({ status_membro: "Membro Professo" }).in("id", ids);
  if (error) { showToast("Erro ao atualizar Membro Professo: " + error.message, true); return; }
  state.members = state.members.map((m) => (ids.includes(m.id) ? { ...m, status_membro: "Membro Professo" } : m));
  render();
}
async function toggleVinculo(tipo, membroId, valor, checked) {
  const table = tipo === "ministerio" ? MIN_TABLE : PROC_TABLE;
  const col = tipo === "ministerio" ? "ministerio" : "processo";
  if (checked) {
    const { data, error } = await sb.from(table).insert({ membro_id: membroId, [col]: valor }).select().single();
    if (error) { showToast("Erro ao vincular: " + error.message, true); return; }
    if (tipo === "ministerio") state.vinculosMinisterios.push(data); else state.vinculosProcessos.push(data);
  } else {
    const { error } = await sb.from(table).delete().eq("membro_id", membroId).eq(col, valor);
    if (error) { showToast("Erro ao remover: " + error.message, true); return; }
    if (tipo === "ministerio") state.vinculosMinisterios = state.vinculosMinisterios.filter((v) => !(v.membro_id === membroId && v.ministerio === valor));
    else state.vinculosProcessos = state.vinculosProcessos.filter((v) => !(v.membro_id === membroId && v.processo === valor));
  }
  render();
}

function getDashboardMembers() {
  return state.members
    .filter((m) => !state.dashFilterIgreja || m.membresia_igreja === state.dashFilterIgreja)
    .filter((m) => !state.dashFilterSituacao.length || state.dashFilterSituacao.includes(m.situacao_membro))
    .filter((m) => !state.dashFilterTipo.length || state.dashFilterTipo.some((t) => memberMatchesTipo(m, t)));
}
function getFilteredMembers() {
  const q = state.search.trim().toLowerCase();
  return state.members.filter((m) => {
    if (q) {
      const hay = ((m.nome_completo || "") + " " + (m.email || "")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (state.filterIgreja && m.membresia_igreja !== state.filterIgreja) return false;
    if (state.filterSituacao.length && !state.filterSituacao.includes(m.situacao_membro)) return false;
    if (state.filterTipo.length && !state.filterTipo.some((t) => memberMatchesTipo(m, t))) return false;
    if (state.filterSexo && m.sexo !== state.filterSexo) return false;
    return true;
  });
}
function getPrintMembers() {
  return state.members
    .filter((m) => !state.printFilterIgreja || m.membresia_igreja === state.printFilterIgreja)
    .filter((m) => !state.printFilterSituacao.length || state.printFilterSituacao.includes(m.situacao_membro))
    .filter((m) => !state.printFilterTipo.length || state.printFilterTipo.some((t) => memberMatchesTipo(m, t)))
    .sort((a, b) => (a.nome_completo || "").localeCompare(b.nome_completo || "", "pt-BR"));
}
function getBirthdayMembers() {
  return state.members
    .filter((m) => !state.dashFilterIgreja || m.membresia_igreja === state.dashFilterIgreja)
    .filter((m) => !state.dashFilterSituacao.length || state.dashFilterSituacao.includes(m.situacao_membro))
    .filter((m) => !state.dashFilterTipo.length || state.dashFilterTipo.some((t) => memberMatchesTipo(m, t)))
    .filter((m) => {
      if (!m.dt_nascimento) return false;
      const d = new Date(m.dt_nascimento + "T00:00:00");
      if (isNaN(d)) return false;
      return d.getMonth() + 1 === state.birthMonth;

      return { ...m, _dia: d.getDate(), _completa: new Date().getFullYear() - d.getFullYear() };
    })
    .sort((a, b) => a._dia - b._dia);
}

function getAcolherEligibleMemberIds() {

function eventCoversDay(ev, year, month, day) {
  const d = new Date(year, month - 1, day);
  const s = new Date(ev.data_inicio + "T00:00:00");
  const e = new Date((ev.data_fim || ev.data_inicio) + "T00:00:00");
  return d >= s && d <= e;
}
function getAgendaEventsForMonth() {
  const year = state.agFilterYear;
  const month = state.agFilterMonth;
  const first = new Date(year, month - 1, 1);
  const last = new Date(year, month, 0);
  return state.agenda
    .filter((ev) => {
      const s = new Date(ev.data_inicio + "T00:00:00");
      const e = new Date((ev.data_fim || ev.data_inicio) + "T00:00:00");
      return e >= first && s <= last;
    })
    .filter((ev) => !state.agSelectedDay || eventCoversDay(ev, year, month, state.agSelectedDay))
    .sort((a, b) => a.data_inicio.localeCompare(b.data_inicio));
}
function groupAgendaByDay(events) {
  const map = {};
  events.forEach((ev) => {
    const key = ev.data_inicio;
    if (!map[key]) map[key] = [];
    map[key].push(ev);
  });
  return Object.keys(map).sort().map((k) => ({ date: k, events: map[k] }));
}
function getAgendaEventsForYear() {
  const year = state.agFilterYear;
  const first = new Date(year, 0, 1);
  const last = new Date(year, 11, 31);
  return state.agenda
    .filter((ev) => {
      const s = new Date(ev.data_inicio + "T00:00:00");
      const e = new Date((ev.data_fim || ev.data_inicio) + "T00:00:00");
      return e >= first && s <= last;
    })
    .sort((a, b) => a.data_inicio.localeCompare(b.data_inicio));
}
function groupAgendaByMonth(events) {
  const map = {};
  events.forEach((ev) => {
    const d = new Date(ev.data_inicio + "T00:00:00");
    const key = d.getMonth();
    if (!map[key]) map[key] = [];
    map[key].push(ev);
  });
  return Object.keys(map).map(Number).sort((a, b) => a - b).map((m) => ({ month: m, events: map[m] }));
}
function fmtRange(ev) {
  if (!ev.data_fim || ev.data_fim === ev.data_inicio) return fmtDate(ev.data_inicio);
  return fmtDate(ev.data_inicio) + " – " + fmtDate(ev.data_fim);
}

function computeStats(list) {
  const total = list.length;
  const ativos = list.filter((m) => m.situacao_membro === "Ativo").length;
  const inativos = list.filter((m) => m.situacao_membro === "Inativo").length;
  const homens = list.filter((m) => m.sexo === "Masculino").length;
  const mulheres = list.filter((m) => m.sexo === "Feminino").length;
  const year = new Date().getFullYear();
  const novos = list.filter((m) => m.dt_entrada && new Date(m.dt_entrada).getFullYear() === year).length;

  const bands = [
    { label: "0–11", min: 0, max: 11 }, { label: "12–17", min: 12, max: 17 }, { label: "18–30", min: 18, max: 30 },
    { label: "31–50", min: 31, max: 50 }, { label: "51–65", min: 51, max: 65 }, { label: "66+", min: 66, max: 999 },
  ];
  const ageCounts = bands.map((b) => ({ ...b, count: list.filter((m) => { const age = getAge(m.dt_nascimento); return age !== null && age >= b.min && age <= b.max; }).length }));
  const maxAge = Math.max(1, ...ageCounts.map((b) => b.count));

  const porIgreja = IGREJAS.map((ig) => ({ nome: ig, count: list.filter((m) => m.membresia_igreja === ig).length }));

  const anos = [];
  for (let y = 2021; y <= year; y++) anos.push(y);
  const porAno = anos.map((y) => ({ ano: y, count: list.filter((m) => m.dt_entrada && new Date(m.dt_entrada).getFullYear() === y).length }));
  const maxAno = Math.max(1, ...porAno.map((b) => b.count));

  return { total, ativos, inativos, homens, mulheres, novos, ageCounts, maxAge, porIgreja, porAno, maxAno };
}

/* =====================================================================
   EXPORTAR EXCEL
   ===================================================================== */
function exportXLSX() {
  const list = getFilteredMembers();
  const rows = list.map((m) => { const row = {}; FIELDS.forEach((f) => { row[f.label] = m[f.key] ?? ""; }); return row; });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Membros");
  XLSX.writeFile(wb, "membros_" + new Date().toISOString().slice(0, 10) + ".xlsx");
}

      '<div class="panel">' +
        '<div class="toolbar">' +
          '<input type="text" id="min-search" placeholder="Buscar por nome…" value="' + esc(state.minSearch) + '" />' +
          '<span class="sub-cell">' + (state.minSelected ? esc(state.minSelected) + (isAcolherSelected ? " · exclui membros Inativos" : "") + (state.minSource === "funnel" ? " · " + rightMembers.filter((m) => vinculosAtual.some((v) => v.membro_id === m.id && v[col] === state.minSelected)).length + " membro(s) nesta categoria" : "") : "Selecione uma categoria à esquerda") + "</span>" +
        "</div>" +
        (!state.minSelected
          ? '<div class="empty-state">Escolha um ministério ou processo para ver e marcar os membros.</div>'
          : '<div class="member-pick-list">' +
            (state.minSource === "funnel"
              ? rightMembers.filter((m) => vinculosAtual.some((v) => v.membro_id === m.id && v[col] === state.minSelected))
              : rightMembers
            ).map((m) => {
              const checked = vinculosAtual.some((v) => v.membro_id === m.id && v[col] === state.minSelected);
              return (
                '<label class="member-pick-row"><input type="checkbox" class="min-member-chk" data-id="' + m.id + '" ' + (checked ? "checked" : "") + " />" +
                '<div><div class="name-cell">' + esc(m.nome_completo || "—") + '</div><div class="sub-cell">' + esc(m.membresia_igreja || "") + " · " + esc(m.situacao_membro || "") + "</div></div></label>"
              );
            }).join("") + "</div>") +
      "</div>" +
    "</div>" +
    '<div class="two-col">' +
      '<div class="panel"><div class="panel-head">Funil de Ministérios</div><div class="funnel">' +
        minCounts.map((c) => '<button class="funnel-bar" data-type="ministerio" data-name="' + esc(c.nome) + '" style="width:' + Math.max(22, (c.count / maxMin) * 100) + '%;">' + esc(c.nome) + " — " + c.count + "</button>").join("") +
      "</div></div>" +
      '<div class="panel"><div class="panel-head">Funil de Processos</div><div class="funnel">' +
        procCounts.map((c) => {
          const acolherCount = (procCounts.find((p) => p.nome === "Acolher") || {}).count || 0;
          const pct = c.nome !== "Acolher" && acolherCount > 0 ? " (" + Math.round((c.count / acolherCount) * 100) + "%)" : "";
          return '<button class="funnel-bar" data-type="processo" data-name="' + esc(c.nome) + '" style="width:' + Math.max(30, (c.count / maxProc) * 100) + '%;">' + esc(c.nome) + " — " + c.count + pct + "</button>";
        }).join("") +
      "</div></div>" +
    "</div>"
  );
}
function attachMinisteriosListeners() {
  document.getElementById("min-global-igreja")?.addEventListener("change", (e) => { state.minGlobalIgreja = e.target.value; render(); });
  document.querySelectorAll(".chip[data-primary]").forEach((btn) => btn.addEventListener("click", () => {
    state.minPrimary = btn.dataset.primary;
    state.minSelected = "";
    state.minSource = null;
    render();
  }));
  document.querySelectorAll(".cat-item[data-cat]").forEach((btn) => btn.addEventListener("click", () => { state.minSelected = btn.dataset.cat; state.minSource = "list"; render(); }));
  document.querySelectorAll(".funnel-bar[data-type]").forEach((btn) => btn.addEventListener("click", () => {
    state.minPrimary = btn.dataset.type === "ministerio" ? "ministerios" : "processos";
    state.minSelected = btn.dataset.name;
    state.minSource = "funnel";
    render();
  }));
  const searchInput = document.getElementById("min-search");
  if (searchInput) {
    searchInput.addEventListener("input", (e) => {
      state.minSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el = document.getElementById("min-search");
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    });
  }
  document.querySelectorAll(".min-member-chk").forEach((chk) => {
    chk.addEventListener("change", (e) => {
      toggleVinculo(state.minPrimary === "ministerios" ? "ministerio" : "processo", Number(chk.dataset.id), state.minSelected, e.target.checked);
    });
  });
}

/* =====================================================================
   ABA: AGENDAMENTOS
   ===================================================================== */
function renderAgendaTab() {
  const year = state.agFilterYear;
  const month = state.agFilterMonth;
  const monthEvents = getAgendaEventsForMonth();
  const yearEvents = getAgendaEventsForYear();
  const listEvents = state.agShowFullYear ? yearEvents : monthEvents;
  const grouped = state.agShowFullYear ? null : groupAgendaByDay(monthEvents);
  const groupedByMonth = state.agShowFullYear ? groupAgendaByMonth(yearEvents) : null;
  const anoAtualAg = new Date().getFullYear();
  const anos = [];
  for (let y = 2021; y <= anoAtualAg + 1; y++) anos.push(y);

  const first = new Date(year, month - 1, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dayEvents = state.agenda.filter((ev) => eventCoversDay(ev, year, month, d));
    const has = dayEvents.length > 0;
    const shown = dayEvents.slice(0, 2);
    const extra = dayEvents.length - shown.length;
    cells += '<button type="button" class="cal-cell ' + (has ? "has-event" : "") + (state.agSelectedDay === d ? " selected" : "") + '" data-day="' + d + '">' +
      '<span class="cal-cell-num">' + d + "</span>" +
      (has
        ? '<span class="cal-cell-events">' +
          shown.map((ev) => '<span class="cal-cell-event-chip">' + esc(ev.titulo) + "</span>").join("") +
          (extra > 0 ? '<span class="cal-cell-more">+' + extra + " mais</span>" : "") +
          "</span>"
        : "") +
      "</button>";
  }

  return (
    '<div class="topbar">' +
      '<div><h2 class="page-title">Agendamentos</h2><p class="page-sub">Calendário de eventos e comentários da igreja.</p></div>' +
      '<div style="display:flex; gap:10px;">' +
        '<select id="ag-filter-month" class="gm-select">' + MESES.map((m, i) => '<option value="' + (i + 1) + '" ' + (month === i + 1 ? "selected" : "") + ">" + m + "</option>").join("") + "</select>" +
        '<select id="ag-filter-year" class="gm-select">' + anos.map((y) => '<option value="' + y + '" ' + (year === y ? "selected" : "") + ">" + y + "</option>").join("") + "</select>" +
        '<button id="btn-new-event" class="btn btn-gold btn-sm">+ Novo evento</button>' +
      "</div>" +
    "</div>" +
    '<div class="ag-shell">' +
      '<div class="panel">' +
        '<div class="cal-head"><strong>' + MESES[month - 1] + " " + year + "</strong>" +
          (state.agSelectedDay ? '<button id="btn-clear-day" class="btn btn-ghost btn-sm">Limpar dia</button>' : "") +
        "</div>" +
        '<div class="cal-weekdays">' + DIAS_SEMANA.map((d) => '<div class="cal-weekday">' + d + "</div>").join("") + "</div>" +
        '<div class="cal-grid">' + cells + "</div>" +
      "</div>" +
      '<div class="panel">' +
        '<div class="panel-head"><span class="ag-panel-title">' + (state.agShowFullYear ? "Eventos de " + year : "Eventos do mês") + '</span> <span class="badge badge-off">' + listEvents.length + "</span>" +
          '<button id="btn-toggle-year" class="btn btn-ghost btn-sm">' + (state.agShowFullYear ? "Voltar ao mês" : "Listar ano completo") + "</button>" +
        "</div>" +
        '<div class="print-target">' +
          '<div class="print-header"><h3 class="ag-print-title">' + (state.agShowFullYear ? "Eventos de " + year : "Eventos de " + MESES[month - 1] + " de " + year) + "</h3></div>" +
          (state.loadingAgenda
            ? '<div class="empty-state">Carregando…</div>'
            : listEvents.length === 0
            ? '<div class="empty-state">Nenhum evento neste período.</div>'
            : state.agShowFullYear
            ? groupedByMonth.map((g) =>
                '<div class="ag-event-day">' +
                  '<div class="ag-event-day-label">' + MESES[g.month] + "</div>" +
                  g.events.map((ev) =>
                    '<div class="ag-event-card">' +
                      '<div class="ag-event-title">' + esc(ev.titulo) + "</div>" +
                      '<div class="ag-event-range">' + fmtRange(ev) + "</div>" +
                      (ev.descricao ? '<div class="ag-event-desc">' + esc(ev.descricao) + "</div>" : "") +
                      '<div class="ag-event-actions gm-noprint">' +
                        '<button class="icon-btn btn-edit-event" data-id="' + ev.id + '">Editar</button>' +
                        '<button class="icon-btn btn-delete-event" data-id="' + ev.id + '" data-titulo="' + esc(ev.titulo) + '">Excluir</button>' +
                      "</div>" +
                    "</div>"
                  ).join("") +
                "</div>"
              ).join("")
            : grouped.map((g) =>
                '<div class="ag-event-day">' +
                  '<div class="ag-event-day-label">' + fmtDate(g.date) + "</div>" +
                  g.events.map((ev) =>
                    '<div class="ag-event-card">' +
                      '<div class="ag-event-title">' + esc(ev.titulo) + "</div>" +
                      '<div class="ag-event-range">' + fmtRange(ev) + "</div>" +
                      (ev.descricao ? '<div class="ag-event-desc">' + esc(ev.descricao) + "</div>" : "") +
                      '<div class="ag-event-actions gm-noprint">' +
                        '<button class="icon-btn btn-edit-event" data-id="' + ev.id + '">Editar</button>' +
                        '<button class="icon-btn btn-delete-event" data-id="' + ev.id + '" data-titulo="' + esc(ev.titulo) + '">Excluir</button>' +
                      "</div>" +
                    "</div>"
                  ).join("") +
                "</div>"
              ).join("")) +
        "</div>" +
        '<div class="toolbar gm-noprint" style="justify-content:center; border-bottom:none;">' +
          '<button id="btn-print-agenda" class="btn btn-gold btn-sm" ' + (listEvents.length === 0 ? "disabled" : "") + ">Imprimir</button>" +
        "</div>" +
      "</div>" +
    "</div>"
  );
}
function attachAgendaListeners() {
  document.getElementById("ag-filter-month")?.addEventListener("change", (e) => { state.agFilterMonth = Number(e.target.value); state.agSelectedDay = null; render(); });
  document.getElementById("ag-filter-year")?.addEventListener("change", (e) => { state.agFilterYear = Number(e.target.value); state.agSelectedDay = null; render(); });
  document.getElementById("btn-clear-day")?.addEventListener("click", () => { state.agSelectedDay = null; render(); });
  document.getElementById("btn-toggle-year")?.addEventListener("click", () => { state.agShowFullYear = !state.agShowFullYear; render(); });
  document.getElementById("btn-print-agenda")?.addEventListener("click", () => window.print());
  document.querySelectorAll(".cal-cell[data-day]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const day = Number(btn.dataset.day);
      state.agSelectedDay = state.agSelectedDay === day ? null : day;
      render();
    });
  });
  document.getElementById("btn-new-event")?.addEventListener("click", () => {
    state.agEditing = null;
    state.agModalOpen = true;
    render();
  });
  document.querySelectorAll(".btn-edit-event").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.agEditing = state.agenda.find((ev) => String(ev.id) === String(btn.dataset.id)) || null;
      state.agModalOpen = true;
      render();
    });
  });
  document.querySelectorAll(".btn-delete-event").forEach((btn) => {
    btn.addEventListener("click", () => deleteAgendaEvent(btn.dataset.id, btn.dataset.titulo));
  });
}
function renderAgendaModal() {
  const ev = state.agEditing || {};
  const isEdit = !!ev.id;
  let defaultStart = "";
  if (!isEdit && state.agSelectedDay) {
    defaultStart = state.agFilterYear + "-" + String(state.agFilterMonth).padStart(2, "0") + "-" + String(state.agSelectedDay).padStart(2, "0");
  }
  return (
    '<div class="modal-backdrop" id="ag-modal-backdrop"><div class="modal">' +
      '<div class="modal-head"><h3>' + (isEdit ? "Editar evento" : "Novo evento") + '</h3><button class="modal-close" id="ag-modal-close">&times;</button></div>' +
      '<form id="agenda-form"><div class="modal-body"><div class="form-grid">' +
        '<div class="field full"><label for="ag-fld-titulo">Título *</label><input id="ag-fld-titulo" name="titulo" type="text" value="' + esc(ev.titulo || "") + '" required /></div>' +
        '<div class="field"><label for="ag-fld-inicio">Data de início *</label><input id="ag-fld-inicio" name="data_inicio" type="date" value="' + esc(ev.data_inicio || defaultStart) + '" required /></div>' +
        '<div class="field"><label for="ag-fld-fim">Data de fim (opcional, se for mais de um dia)</label><input id="ag-fld-fim" name="data_fim" type="date" value="' + esc(ev.data_fim || "") + '" /></div>' +
        '<div class="field full"><label for="ag-fld-descricao">Comentário</label><textarea id="ag-fld-descricao" name="descricao" rows="4" style="width:100%; padding:11px 13px; border:1px solid var(--line-2); border-radius:9px; font-size:14px; background:var(--cream); color:var(--ink); font-family:inherit; resize:vertical;">' + esc(ev.descricao || "") + "</textarea></div>" +
      "</div></div>" +
      '<div class="modal-foot"><button type="button" class="btn btn-ghost" id="ag-modal-cancel">Cancelar</button><button type="submit" class="btn btn-gold" ' + (state.agSaving ? "disabled" : "") + ">" + (state.agSaving ? "Salvando…" : "Salvar") + "</button></div></form>" +
    "</div></div>"
  );
}
function attachAgendaModalListeners() {
  document.getElementById("ag-modal-close")?.addEventListener("click", closeAgendaModal);
  document.getElementById("ag-modal-cancel")?.addEventListener("click", closeAgendaModal);
  document.getElementById("ag-modal-backdrop")?.addEventListener("click", (e) => { if (e.target.id === "ag-modal-backdrop") closeAgendaModal(); });
  const form = document.getElementById("agenda-form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {
        titulo: fd.get("titulo"),
        data_inicio: fd.get("data_inicio"),
        data_fim: fd.get("data_fim") || null,
        descricao: fd.get("descricao") || null,
      };
      saveAgendaEvent(payload, state.agEditing && state.agEditing.id);
    });
  }
}
function closeAgendaModal() { state.agModalOpen = false; state.agEditing = null; render(); }

/* =====================================================================
   ABA: IMPRESSÃO
   ===================================================================== */
function renderImpressaoTab() {
  const list = getPrintMembers();
  const selectedFields = PRINT_FIELDS.filter((f) => state.printFields[f.key]);

  const filtrosResumo = [
    state.printFilterIgreja || "Todas as igrejas",
    state.printFilterSituacao.length ? state.printFilterSituacao.join("/") : "Todas as situações",
    state.printFilterTipo.length ? state.printFilterTipo.join("/") : "Todos os tipos",
  ].join(" · ");

  return (
    '<div class="topbar"><div><h2 class="page-title">Impressão</h2><p class="page-sub">Gere listas para assembleia ou controle, com os campos que precisar.</p></div></div>' +
    '<div class="panel gm-noprint">' +
      '<div class="panel-head">Filtros</div>' +
      '<div class="toolbar">' +
        '<select id="print-filter-igreja" class="gm-select"><option value="">Todas as igrejas</option>' + IGREJAS.map((i) => '<option value="' + esc(i) + '" ' + (state.printFilterIgreja === i ? "selected" : "") + ">" + esc(i) + "</option>").join("") + "</select>" +
      "</div>" +
      '<div class="toolbar">' +
        '<span class="filter-label">Situação:</span>' + renderChipGroup("print-situacao", ["Ativo", "Inativo"], state.printFilterSituacao) +
        '<span class="filter-label" style="margin-left:10px;">Tipo:</span>' + renderChipGroup("print-tipo", TIPOS_MEMBRO, state.printFilterTipo) +
      "</div>" +
      '<div class="panel-head" style="border-top:1px solid var(--line);">Campos a imprimir</div>' +
      '<div class="check-list">' + PRINT_FIELDS.map((f) => '<label class="check-row"><input type="checkbox" class="print-field-chk" data-key="' + f.key + '" ' + (state.printFields[f.key] ? "checked" : "") + " />" + esc(f.label) + "</label>").join("") + "</div>" +
      '<div class="toolbar" style="border-top:1px solid var(--line); border-bottom:none;">' +
        '<span class="sub-cell">' + list.length + " membro(s) correspondem aos filtros — " + filtrosResumo + "</span>" +
        '<div class="spacer"></div>' +
        '<button id="btn-print" class="btn btn-gold btn-sm" ' + (selectedFields.length === 0 ? "disabled" : "") + ">Imprimir / Salvar PDF</button>" +
      "</div>" +
    "</div>" +
    '<div class="panel">' +
      '<div class="print-target">' +
        '<div class="print-header"><h3>Lista de Membros</h3><p>' + filtrosResumo + " · Emitido em " + new Date().toLocaleDateString("pt-BR") + " · " + list.length + " membro(s)</p></div>" +
        (selectedFields.length === 0
          ? '<div class="empty-state">Selecione ao menos um campo para gerar a lista.</div>'
          : '<table class="print-table"><thead><tr><th style="width:36px;">#</th>' + selectedFields.map((f) => "<th>" + esc(f.label === "Assinatura (coluna em branco)" ? "Assinatura" : f.label) + "</th>").join("") + "</tr></thead><tbody>" +
            list.map((m, i) =>
              "<tr><td>" + (i + 1) + "</td>" +
              selectedFields.map((f) => {
                if (f.key === "assinatura") return '<td class="sig-cell">&nbsp;</td>';
                if (f.key === "telefone") return "<td>" + esc(m.celular || m.fone || "") + "</td>";
                if (f.key === "dt_nascimento") return "<td>" + fmtDate(m.dt_nascimento) + "</td>";
                return "<td>" + esc(m[f.key] || "") + "</td>";
              }).join("") + "</tr>"
            ).join("") + "</tbody></table>") +
      "</div>" +
    "</div>"
  );
}
function attachImpressaoListeners() {
  document.getElementById("print-filter-igreja")?.addEventListener("change", (e) => { state.printFilterIgreja = e.target.value; render(); });
  document.querySelectorAll(".print-field-chk").forEach((chk) => chk.addEventListener("change", (e) => { state.printFields[chk.dataset.key] = e.target.checked; render(); }));
  document.getElementById("btn-print")?.addEventListener("click", () => window.print());
}

/* =====================================================================
   MODAL DE CADASTRO / EDIÇÃO
   ===================================================================== */
function renderModal() {
  const m = state.editingMember || {};
  const isEdit = !!m.id;
  return (
    '<div class="modal-backdrop" id="modal-backdrop"><div class="modal">' +
      '<div class="modal-head"><h3>' + (isEdit ? "Editar membro" : "Novo membro") + '</h3><button class="modal-close" id="modal-close">&times;</button></div>' +
      '<form id="member-form"><div class="modal-body"><div class="form-grid">' + FIELDS.map((f) => renderField(f, m)).join("") + "</div></div>" +
      '<div class="modal-foot"><button type="button" class="btn btn-ghost" id="modal-cancel">Cancelar</button><button type="submit" class="btn btn-gold" ' + (state.saving ? "disabled" : "") + ">" + (state.saving ? "Salvando…" : "Salvar") + "</button></div></form>" +
    "</div></div>"
  );
}
function renderField(f, m) {
  const val = m[f.key] ?? "";
  const cls = f.full ? "field full" : "field";
  if (f.type === "select") {
    return '<div class="' + cls + '"><label for="fld-' + f.key + '">' + f.label + (f.required ? " *" : "") + "</label>" +
      '<select id="fld-' + f.key + '" name="' + f.key + '" ' + (f.required ? "required" : "") + '><option value=""></option>' +
      f.options.map((o) => '<option value="' + esc(o) + '" ' + (val === o ? "selected" : "") + ">" + esc(o) + "</option>").join("") + "</select></div>";
  }
  return '<div class="' + cls + '"><label for="fld-' + f.key + '">' + f.label + (f.required ? " *" : "") + '</label><input id="fld-' + f.key + '" name="' + f.key + '" type="' + f.type + '" value="' + esc(val) + '" ' + (f.required ? "required" : "") + " /></div>";
}
function attachModalListeners() {
  document.getElementById("modal-close")?.addEventListener("click", closeModal);
  document.getElementById("modal-cancel")?.addEventListener("click", closeModal);
  document.getElementById("modal-backdrop")?.addEventListener("click", (e) => { if (e.target.id === "modal-backdrop") closeModal(); });
  const form = document.getElementById("member-form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {};
      FIELDS.forEach((f) => { let v = fd.get(f.key); if (v === "") v = null; payload[f.key] = v; });
      saveMember(payload, state.editingMember && state.editingMember.id);
    });
  }
}
function closeModal() { state.modalOpen = false; state.editingMember = null; render(); }

/* =====================================================================
   RENDER ROOT
   ===================================================================== */
function render() {
  if (state.loadingSession) { root.innerHTML = '<div class="loading-wrap">Carregando…</div>'; return; }
  if (!state.session) { renderLogin(); return; }
  let body = "";
  if (state.activeTab === "dashboard") body = renderDashboardTab();
  else if (state.activeTab === "tabela") body = renderTabelaTab();
  else if (state.activeTab === "ministerios") body = renderMinisteriosTab();
  else if (state.activeTab === "agendamentos") body = renderAgendaTab();
  else body = renderImpressaoTab();
  renderShell(body);
}

initAuth();
</script>
