<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IPI Cavallari - Membros</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://bzcgocfslmyljbafyxdf.supabase.co https://cdn.jsdelivr.net; base-uri 'none'; form-action 'self'; object-src 'none';" />
<meta name="referrer" content="strict-origin-when-cross-origin" />

<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

  :root{
    --cream:#EEF5FB; --cream-2:#E0EEF8; --line:#D3E4F0; --line-2:#BEDAEA;
    --gold:#009be7; --gold-2:#00acbd; --ink:#12162A; --ink-2:#1B2036; --ink-3:#262C48;
    --slate:#4C5D8A; --slate-2:#8D91AC; --lav:#C9CBDE; --danger:#7C3345; --warn:#393bd8; --ok:#00ba8d; --white:#FFFFFF;
    --brand-1:#00ba8d; --brand-2:#00acbd; --brand-3:#009be7; --brand-4:#0085ff; --brand-5:#0068fb; --brand-6:#393bd8;
    --cal-line:#EAF1F8;
  }
  *{ box-sizing:border-box; }
  html{ width:100%; }
  html, body{ margin:0; padding:0; width:100%; min-height:100%; }
  body{ font-family:'Inter',-apple-system,sans-serif; background:var(--cream); color:var(--ink); }
  #root{ width:100%; min-height:100vh; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:8px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  h1,h2,h3,.serif{ font-family:'Fraunces',serif; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; }

  .login-wrap{ min-height:100vh; width:100%; display:flex; }
  .login-brand-panel{ flex:1 1 50%; background:var(--white); border-right:1px solid var(--line); display:flex; align-items:center; justify-content:center; padding:40px; min-height:100vh; }
  .login-brand-panel .login-logo-svg{ width:100%; max-width:360px; height:auto; }
  .login-form-panel{ flex:1 1 50%; display:flex; align-items:center; justify-content:center; padding:24px; min-height:100vh;
    background:radial-gradient(600px 300px at 85% -10%, rgba(0,155,231,.14), transparent), var(--cream); }
  @media (max-width: 860px){
    .login-wrap{ flex-direction:column; }
    .login-brand-panel{ min-height:260px; padding:28px; flex:0 0 auto; }
    .login-brand-panel .login-logo-svg{ max-width:200px; }
    .login-form-panel{ min-height:0; flex:1 1 auto; padding:32px 24px 48px; }
  }
  .login-card{ width:100%; max-width:380px; background:var(--white); border:1px solid var(--line); border-radius:16px; padding:36px 32px; box-shadow:0 20px 50px -20px rgba(18,22,42,.25); }
  .login-eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:8px; }
  .login-title{ font-size:26px; font-weight:600; margin:0 0 4px; color:var(--ink); }
  .login-sub{ color:var(--slate); font-size:14px; margin:0 0 28px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-3); margin-bottom:6px; letter-spacing:.02em; }
  .field input, .field select, .field textarea{ width:100%; padding:11px 13px; border:1px solid var(--line-2); border-radius:9px; font-size:14px; background:var(--cream); color:var(--ink); font-family:inherit; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:9px; font-weight:600; font-size:14px; padding:11px 18px; transition:opacity .15s ease, transform .1s ease; }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background:var(--ink); color:var(--white); width:100%; }
  .btn-primary:hover{ opacity:.88; }
  .btn-gold{ background:var(--gold); color:var(--white); }
  .btn-gold:hover{ opacity:.9; }
  .btn-ghost{ background:transparent; color:var(--ink-3); border:1px solid var(--line-2); }
  .btn-ghost:hover{ background:var(--cream-2); }
  .btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:7px; }
  .error-box{ background:#fdf2f2; border:1px solid #f0c9c9; color:var(--danger); font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:16px; }
  .btn-google-login{ width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px 18px; border:1px solid var(--line-2); border-radius:9px; background:var(--white); color:var(--ink); font-family:inherit; font-size:14.5px; font-weight:600; box-shadow:0 1px 2px rgba(18,22,42,.06); transition:background .15s ease, box-shadow .15s ease, transform .1s ease; }
  .btn-google-login:hover:not(:disabled){ background:var(--cream-2); box-shadow:0 2px 6px rgba(18,22,42,.1); }
  .btn-google-login:active:not(:disabled){ transform:scale(.98); }
  .btn-google-login:disabled{ opacity:.6; cursor:not-allowed; }

  .shell{ display:flex; width:100%; min-height:100vh; }
  .sidebar{ width:230px; flex:0 0 230px; background:var(--ink); color:var(--lav); padding:24px 18px; display:flex; flex-direction:column; transition:width .18s ease, padding .18s ease; overflow:hidden; }
  .sidebar.collapsed{ width:76px; flex:0 0 76px; padding:24px 14px; }
  .sidebar-top{ display:flex; align-items:center; gap:6px; margin-bottom:28px; }
  .sidebar.collapsed .sidebar-top{ flex-direction:column; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .sidebar.collapsed .brand{ flex:none; }
  .brand-mark{ width:34px; height:34px; border-radius:9px; background:var(--white); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; padding:3px; }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; }
  .brand-text{ min-width:0; overflow:hidden; white-space:nowrap; }
  .sidebar.collapsed .brand-text{ display:none; }
  .brand-name{ font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--white); line-height:1.2; overflow:hidden; text-overflow:ellipsis; }
  .brand-sub{ font-size:10.5px; color:var(--slate-2); letter-spacing:.05em; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-toggle{ background:none; border:1px solid var(--ink-3); color:var(--lav); cursor:pointer; padding:6px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sidebar-toggle:hover{ background:var(--ink-2); color:var(--white); }
  .sidebar-toggle svg{ transition:transform .18s ease; }
  .sidebar.collapsed .sidebar-toggle svg{ transform:rotate(180deg); }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; font-size:13.5px; color:var(--lav); margin-bottom:2px; font-weight:500; border:none; background:none; width:100%; text-align:left; white-space:nowrap; }
  .nav-item:hover{ background:var(--ink-2); color:var(--white); }
  .nav-item.active{ background:var(--ink-3); color:var(--white); }
  .nav-icon{ width:18px; height:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .nav-label{ overflow:hidden; text-overflow:ellipsis; }
  .sidebar.collapsed .nav-item{ justify-content:center; padding:10px; }
  .sidebar.collapsed .nav-label{ display:none; }
  .sidebar-footer{ margin-top:auto; padding-top:16px; border-top:1px solid var(--ink-3); }
  .user-chip{ font-size:12px; color:var(--slate-2); margin-bottom:10px; word-break:break-all; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sidebar.collapsed .user-chip{ display:none; }
  .sidebar.collapsed .sidebar-footer .btn{ width:100%; padding:9px 0; }
  .sidebar.collapsed .sidebar-footer .btn .btn-label{ display:none; }
  .sidebar-footer .btn{ display:flex; align-items:center; justify-content:center; gap:8px; }

  .main{ flex:1 1 auto; min-width:0; width:100%; padding:28px 34px 60px; }
  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:14px; }
  .page-title{ font-size:28px; font-weight:600; margin:0 0 4px; }
  .page-sub{ color:var(--slate); font-size:13.5px; margin:0; }

  .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:26px; width:100%; }
  .stat-card{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:16px 18px; display:flex; align-items:center; gap:13px; transition:border-color .15s ease, transform .15s ease; }
  .stat-card:hover{ border-color:var(--line-2); transform:translateY(-1px); }
  .stat-icon{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .stat-icon svg{ width:21px; height:21px; }
  .stat-icon.c-ink{ background:rgba(18,22,42,.07); color:var(--ink); }
  .stat-icon.c-ok{ background:rgba(0,186,141,.13); color:var(--ok); }
  .stat-icon.c-warn{ background:rgba(57,59,216,.12); color:var(--warn); }
  .stat-icon.c-blue{ background:rgba(0,155,231,.13); color:var(--brand-3); }
  .stat-icon.c-violet{ background:rgba(139,92,246,.14); color:#8B5CF6; }
  .stat-icon.c-teal{ background:rgba(0,172,189,.14); color:var(--brand-2); }
  .stat-icon.c-danger{ background:rgba(124,51,69,.12); color:var(--danger); }
  .stat-body{ min-width:0; }
  .stat-label{ font-size:11.5px; color:var(--slate); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-value{ font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; color:var(--ink); line-height:1; }
  .stat-value.gold{ color:var(--gold); } .stat-value.ok{ color:var(--ok); } .stat-value.warn{ color:var(--warn); }

  .panel{ background:var(--white); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:24px; width:100%; }
  .panel-head{ padding:16px 20px; border-bottom:1px solid var(--line); font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .age-bars{ padding:18px 20px; display:flex; flex-direction:column; gap:10px; }
  .age-row{ display:flex; align-items:center; gap:12px; font-size:12.5px; }
  .age-row-label{ width:64px; color:var(--slate); flex-shrink:0; }
  .age-row-track{ flex:1; background:var(--cream-2); border-radius:6px; height:10px; overflow:hidden; }
  .age-row-fill{ height:100%; background:var(--gold); border-radius:6px; }
  .age-row-count{ width:auto; min-width:26px; text-align:right; font-family:'JetBrains Mono',monospace; color:var(--ink-3); white-space:nowrap; }
  .age-row-pct{ color:var(--slate); font-weight:400; font-size:10.5px; }
  .age-row-growth{ display:inline-block; margin-left:4px; padding:1px 6px; border-radius:99px; font-size:10px; font-weight:700; font-family:'Inter',sans-serif; background:var(--cream-2); color:var(--slate); }
  .age-row-growth.up{ background:#DFF5EF; color:var(--ok); }
  .age-row-growth.down{ background:#E5E4FA; color:var(--brand-6); }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; padding:16px 20px; border-bottom:1px solid var(--line); align-items:center; }
  .toolbar input[type=text], .toolbar select, select.gm-select{ padding:9px 12px; border:1px solid var(--line-2); border-radius:8px; font-size:13.5px; background:var(--cream); color:var(--ink); font-family:inherit; }
  .toolbar input[type=text]{ flex:1; min-width:200px; }
  .spacer{ flex:1; }
  .toolbar-standalone{ border:1px solid var(--line); border-radius:12px; background:var(--white); margin-bottom:20px; border-bottom:1px solid var(--line); }
  .filter-label{ color:var(--slate); font-size:12px; font-weight:600; }

  .chip-toggle{ padding:7px 13px; border-radius:99px; border:1px solid var(--line-2); background:var(--cream); font-size:12.5px; font-weight:600; color:var(--ink-3); }
  .chip-toggle:hover{ background:var(--cream-2); }
  .chip-toggle.active{ background:var(--gold); color:#fff; border-color:var(--gold); }
  .switch-wrap{ display:inline-flex; align-items:center; gap:9px; cursor:pointer; user-select:none; }
  .switch-wrap input{ position:absolute; opacity:0; width:0; height:0; }
  .switch-track{ width:38px; height:22px; border-radius:99px; background:var(--line-2); position:relative; transition:background .15s ease; flex-shrink:0; }
  .switch-thumb{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--white); box-shadow:0 1px 2px rgba(18,22,42,.25); transition:transform .15s ease; }
  .switch-wrap input:checked + .switch-track{ background:var(--gold); }
  .switch-wrap input:checked + .switch-track .switch-thumb{ transform:translateX(16px); }
  .switch-label{ font-size:12.5px; font-weight:600; color:var(--ink-3); }

  .table-scroll{ width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }

  /* ---------- Famílias — KPIs ---------- */
  .fam-kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px; margin-bottom:20px; }
  .fam-kpi{ display:flex; align-items:center; gap:14px; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:16px 18px; text-align:left; font-family:inherit; transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
  .fam-kpi-icon{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:rgba(18,22,42,.06); color:var(--ink-3); }
  .fam-kpi-icon svg{ width:20px; height:20px; }
  .fam-kpi-label{ font-size:11.5px; color:var(--slate); letter-spacing:.02em; margin-bottom:4px; }
  .fam-kpi-value{ font-family:'JetBrains Mono',monospace; font-size:25px; font-weight:600; color:var(--ink); line-height:1; }
  .fam-kpi-ok{ border-color:#BFE9DC; }
  .fam-kpi-ok .fam-kpi-icon{ background:rgba(0,186,141,.14); color:var(--ok); }
  .fam-kpi-ok .fam-kpi-value{ color:var(--ok); }
  .fam-kpi-alert{ cursor:pointer; border-color:#F0C9C9; background:#FEF7F7; }
  .fam-kpi-alert .fam-kpi-icon{ background:rgba(124,51,69,.13); color:var(--danger); }
  .fam-kpi-alert .fam-kpi-value{ color:var(--danger); }
  .fam-kpi-alert:hover{ border-color:var(--danger); transform:translateY(-1px); box-shadow:0 12px 24px -18px var(--danger); }
  .fam-kpi-alert.active{ box-shadow:0 0 0 2px rgba(124,51,69,.22) inset; }
  .fam-kpi-hint{ margin-left:auto; font-size:10.5px; color:var(--danger); font-weight:700; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; align-self:center; }

  /* ---------- Famílias — barra de filtros e ações ---------- */
  .fam-toolbar2{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  .fam-search-wrap{ position:relative; flex:1 1 240px; min-width:220px; }
  .fam-search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--slate-2); pointer-events:none; }
  .fam-search-wrap input{ width:100%; padding:10px 14px 10px 38px; border:1px solid var(--line-2); border-radius:9px; font-size:13.5px; background:var(--white); color:var(--ink); font-family:inherit; }

  .fam-tag-filter{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; position:relative; }
  .fam-tag{ display:inline-flex; align-items:center; gap:6px; background:#EAF2FF; color:var(--brand-5); border:1px solid #CFE1FF; border-radius:99px; padding:5px 6px 5px 12px; font-size:12.5px; font-weight:600; white-space:nowrap; }
  .fam-tag button{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; border:none; background:rgba(0,104,251,.14); color:inherit; font-size:12px; line-height:1; padding:0; }
  .fam-tag button:hover{ background:rgba(0,104,251,.26); }
  .fam-tag-add{ display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border:1px dashed var(--line-2); border-radius:9px; background:var(--white); color:var(--ink-3); font-size:12.5px; font-weight:600; font-family:inherit; }
  .fam-tag-add:hover{ background:var(--cream-2); border-color:var(--slate-2); }
  .fam-tag-panel{ position:absolute; top:calc(100% + 6px); left:0; z-index:20; min-width:220px; background:var(--white); border:1px solid var(--line); border-radius:12px; box-shadow:0 16px 34px -18px rgba(18,22,42,.35); padding:8px; }
  .fam-tag-option{ display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; font-size:13px; color:var(--ink-3); cursor:pointer; }
  .fam-tag-option:hover{ background:var(--cream-2); }
  .fam-tag-option input{ width:15px; height:15px; accent-color:var(--gold); flex-shrink:0; }

  .fam-seg{ display:inline-flex; border:1px solid var(--line-2); border-radius:9px; overflow:hidden; background:var(--white); }
  .fam-seg .chip-toggle{ border:none; border-radius:0; background:var(--white); padding:9px 15px; }
  .fam-seg .chip-toggle:first-child{ border-radius:8px 0 0 8px; }
  .fam-seg .chip-toggle:last-child{ border-radius:0 8px 8px 0; }
  .fam-seg .chip-toggle + .chip-toggle{ border-left:1px solid var(--line-2); }
  .fam-seg .chip-toggle.active{ background:var(--ink); color:var(--white); }
  .fam-seg .chip-toggle:hover:not(.active){ background:var(--cream-2); }

  .fam-onlysemfamilia-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#FEF7F7; border:1px solid #F0C9C9; border-radius:12px; padding:12px 16px; margin-bottom:18px; color:var(--danger); font-size:13.5px; font-weight:600; }
  .fam-onlysemfamilia-bar button{ margin-left:auto; }

  /* ---------- Famílias — grade de cards ---------- */
  .fam-grid2{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; margin-bottom:26px; }
  .fam-card2{ background:var(--white); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:14px; transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease; position:relative; }
  .fam-card2:hover{ box-shadow:0 18px 38px -24px rgba(18,22,42,.35); transform:translateY(-2px); border-color:var(--line-2); }
  .fam-card2.fam-card-duplicate{ border-color:var(--danger); box-shadow:0 0 0 1px var(--danger); }
  .fam-card2.fam-card-pendente{ border-style:dashed; }

  .fam-card2-head{ display:flex; align-items:flex-start; gap:12px; }
  .fam-avatar{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; }
  .fam-card2-title{ flex:1; min-width:0; }
  .fam-card2-name{ font-family:'Fraunces',serif; font-size:16.5px; font-weight:600; color:var(--ink); line-height:1.3; overflow-wrap:anywhere; }
  .fam-card2-name .fam-responsavel{ font-family:'Inter',sans-serif; font-weight:500; font-size:13px; color:var(--slate); }
  .fam-card2-meta{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:5px; }
  .fam-card2-headright{ display:flex; align-items:flex-start; gap:6px; flex-shrink:0; }

  .fam-status-badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap; }
  .fam-status-badge .dot{ width:6px; height:6px; border-radius:50%; }
  .fam-status-badge.is-ativo{ background:#DFF5EF; color:#0A8F6E; }
  .fam-status-badge.is-ativo .dot{ background:#0A8F6E; }
  .fam-status-badge.is-pendente{ background:#FBF1DE; color:#93650E; }
  .fam-status-badge.is-pendente .dot{ background:#93650E; }

  .fam-menu-wrap{ position:relative; }
  .fam-menu-btn{ display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border:1px solid var(--line-2); background:var(--white); border-radius:8px; color:var(--slate); flex-shrink:0; }
  .fam-menu-btn:hover{ background:var(--cream-2); }
  .fam-menu{ position:absolute; top:calc(100% + 6px); right:0; z-index:20; min-width:190px; background:var(--white); border:1px solid var(--line); border-radius:12px; box-shadow:0 16px 34px -18px rgba(18,22,42,.4); padding:6px; }
  .fam-menu-item{ display:flex; align-items:center; gap:9px; width:100%; padding:9px 11px; border-radius:8px; background:none; border:none; font-family:inherit; font-size:13px; color:var(--ink-3); text-align:left; }

  .cat-card-name{ display:block; font-size:13.5px; font-weight:600; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-card.active .cat-card-name{ color:#fff; }
  .cat-card-count{ display:block; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--slate); margin-top:2px; }
  .cat-card.active .cat-card-count{ color:rgba(255,255,255,.85); }
  .member-pick-list{ max-height:420px; overflow-y:auto; }
  .member-pick-row{ display:flex; align-items:center; gap:11px; padding:10px 20px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .member-pick-row input{ width:17px; height:17px; accent-color:var(--gold); flex-shrink:0; }
  .member-avatar{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; }
  .funnel{ display:flex; flex-direction:column; gap:18px; padding:22px 20px; }
  .funnel-row{ display:flex; align-items:center; gap:14px; border:none; background:none; cursor:pointer; font-family:inherit; text-align:left; padding:0; width:100%; }
  .funnel-row:hover .funnel-fill{ filter:brightness(1.08); }
  .funnel-icon{ width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .funnel-icon svg{ width:20px; height:20px; }
  .funnel-main{ flex:1; min-width:0; }
  .funnel-label-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; font-size:16px; font-weight:600; color:var(--ink-3); margin-bottom:8px; }
  .funnel-count{ font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600; color:var(--slate); white-space:nowrap; }
  .funnel-track{ height:10px; border-radius:6px; background:var(--cream-2); overflow:hidden; }
  .funnel-fill{ height:100%; border-radius:6px; transition:width .3s ease; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(18,22,42,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal{ width:100%; max-width:720px; max-height:88vh; overflow-y:auto; background:var(--white); border-radius:16px; }
  .modal-head{ padding:20px 26px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--white); z-index:1; }
  .modal-head h3{ margin:0; font-size:19px; }
  .modal-close{ background:none; border:none; font-size:20px; color:var(--slate); line-height:1; padding:4px; }
  .modal-body{ padding:22px 26px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .form-grid .full{ grid-column:1 / -1; }
  .modal-foot{ padding:16px 26px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; position:sticky; bottom:0; background:var(--white); }

  .toast{ position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--white); padding:12px 18px; border-radius:10px; font-size:13.5px; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); z-index:80; }
  .toast.err{ background:var(--danger); }
  .loading-wrap{ display:flex; align-items:center; justify-content:center; min-height:60vh; width:100%; color:var(--slate); font-size:14px; }

  @media (max-width: 860px){
    .shell{ flex-direction:column; }
    .sidebar, .sidebar.collapsed{ width:100%; flex:0 0 auto; flex-direction:row; align-items:center; padding:14px 18px; overflow-x:auto; }
    .sidebar-top{ margin-bottom:0; margin-right:12px; }
    .sidebar.collapsed .sidebar-top{ flex-direction:row; }
    .sidebar.collapsed .brand-text{ display:block; }
    .sidebar.collapsed .nav-label{ display:inline; }
    .sidebar-toggle{ display:none; }
    .brand{ margin-bottom:0; margin-right:12px; }
    .sidebar-footer{ margin-top:0; margin-left:auto; padding-top:0; border-top:none; display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .sidebar-footer .btn .btn-label{ display:inline; }
    .user-chip{ display:none; }
    .main{ padding:20px 16px 50px; }
    .form-grid, .two-col, .min-shell{ grid-template-columns:1fr; }
    .ag-shell{ grid-template-columns:1fr; }
    .cal-nav{ padding:14px; gap:10px 14px; }
    .cal-nav-left{ gap:8px; }
    .cal-nav-arrow{ width:36px; height:36px; }
    .cal-nav-today{ padding:9px 14px; }
    .cal-nav-label select, .cal-nav-range{ font-size:18px; }
    .ag-legend{ gap:6px 12px; }
    .cal-weekdays-flat{ padding:0; }
    .cal-cell-flat{ min-height:56px; padding:4px 3px; font-size:11.5px; }
    .cal-cell-num{ font-size:12px; min-width:18px; height:18px; }
    .ag-pill{ font-size:9.5px; padding:2px 4px; }
    .ag-pill-time{ display:none; }
    .ag-week-grid{ grid-template-columns:1fr; }
    .ag-week-col{ min-height:0; }
    .ag-card-body{ padding-right:52px; }
    .modal{ max-width:100%; border-radius:0; max-height:100vh; }
    .modal-backdrop{ padding:0; }
    .modal-body{ padding:16px 16px; }
    .modal-head, .modal-foot{ padding:14px 16px; }
    .icon-btn{ padding:9px 12px; font-size:13px; }
    .row-actions{ flex-wrap:wrap; }
    table{ min-width:640px; }
  }
  @media print{
    body *{ visibility:hidden; }
    .print-target, .print-target *{ visibility:visible; }
    .print-target{ position:absolute; top:0; left:0; width:100%; padding:10px 0; }
    .gm-noprint{ display:none !important; }
    .table-scroll{ overflow-x:visible !important; }
    table{ min-width:0 !important; }
  }

/* =====================================================================
   NORMALIZAÇÃO
   ===================================================================== */
function normalizeIgreja(v) {
  if (!v) return "";
  const s = String(v).toLowerCase();
  if (s.includes("cavallari")) return "IPI Cavallari";
  if (s.includes("vera cruz")) return "Congregação Vera Cruz";
  return String(v).trim();
}
function normalizeSituacao(v) {
  if (!v) return "";
  const s = String(v).toLowerCase().trim();
  if (s.startsWith("ativ")) return "Ativo";
  if (s.startsWith("inativ")) return "Inativo";
  return String(v).trim();
}
function normalizeTipoMembro(v) {
  if (!v) return "";
  const s = String(v).toLowerCase();
  if (s.includes("não profess") || s.includes("nao profess")) return "Não professos";
  if (s.includes("frequent")) return "Frequentes";
  if (s.includes("profess")) return "Membro Professo";
  return String(v).trim();
}
function normalizeRecebidoPor(v) {
  if (!v) return "";
  const s = String(v).toLowerCase();
  const hasBatismo = s.includes("batismo");
  const hasProfissao = s.includes("profiss");
  if (hasBatismo && hasProfissao) return "Batismo e Profissão de Fé";
  if (s.includes("transfer")) return "Transferência";
  if (s.includes("jurisdi")) return "Jurisdição";
  if (hasBatismo) return "Batismo";
  if (s.includes("frequent")) return "Frequentes";
  return String(v).trim();
}
function normalizeSexo(v) {
  if (!v) return "";
  const s = String(v).toLowerCase().trim();
  if (s.includes("homem") || s.startsWith("masc") || s === "m") return "Masculino";
  if (s.includes("mulher") || s.startsWith("fem") || s === "f") return "Feminino";
  return String(v).trim();
}
function normalizeName(v) {
  return String(v || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ");
}
function memberMatchesTipo(m, tipo) {
  return m.status_membro === tipo;
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(d) {
  if (!d) return "—";
  const parts = String(d).split("-");
  if (parts.length !== 3) return d;
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}
function getAge(dob) {
  if (!dob) return null;
  const b = new Date(dob);
  if (isNaN(b)) return null;
  const t = new Date();
  let age = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
  return age;
}
function showToast(msg, isErr) {
  state.toast = { msg, isErr };
  render();
  setTimeout(() => { state.toast = null; render(); }, 3200);
}
function renderChipGroup(group, options, selected) {
  return options.map((o) => '<button type="button" class="chip-toggle ' + (selected.includes(o) ? "active" : "") + '" data-chipgroup="' + group + '" data-chipvalue="' + esc(o) + '">' + esc(o) + "</button>").join("");
}

/* =====================================================================
   MAIÚSCULAS AUTOMÁTICAS
   Todo campo marcado com data-upper="1" é convertido para maiúsculas
   em tempo real, mesmo que o usuário digite em minúsculas.
   ===================================================================== */
function attachUppercaseFields(scope) {
  (scope || document).querySelectorAll('[data-upper="1"]').forEach((el) => {
    el.addEventListener("input", () => {
      const start = el.selectionStart, end = el.selectionEnd;
      const upper = el.value.toUpperCase();
      if (upper !== el.value) {
        el.value = upper;
        if (start !== null && end !== null && typeof el.setSelectionRange === "function") {
          el.setSelectionRange(start, end);
        }
      }
    });
  });
}
function toUpper(v) {
  return v === null || v === undefined ? v : String(v).toUpperCase();
}

/* =====================================================================
   AUTH
   ===================================================================== */
async function checkAccess(email) {
  if (!email) return { authorized: false, isAdmin: false };
  try {
    const { data, error } = await sb.from(ALLOWLIST_TABLE).select("email, admin").ilike("email", email).maybeSingle();
    if (error) { console.error("Erro ao verificar autorização de acesso:", error.message); return { authorized: false, isAdmin: false }; }
    if (!data) return { authorized: false, isAdmin: false };
    return { authorized: true, isAdmin: !!data.admin };
  } catch (e) {
    console.error("Erro ao verificar autorização de acesso:", e);
    return { authorized: false, isAdmin: false };
  }
}
async function initAuth() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    state.checkingAccess = true; render();
    const { authorized, isAdmin } = await checkAccess(data.session.user.email);
    state.checkingAccess = false;
    if (!authorized) {
      state.loginError = "A conta " + (data.session.user.email || "") + " não está autorizada a acessar este sistema. Fale com o administrador para liberar seu acesso.";
      await sb.auth.signOut();
      state.session = null;
    } else {
      state.session = data.session;
      state.isAdmin = isAdmin;
    }
  } else {
    state.session = null;
  }
  state.loadingSession = false;
  if (state.session) warmStartFromCache();
  render();
  if (state.session) { await bootstrapData(); startIdleWatcher(); }

  sb.auth.onAuthStateChange(async (_event, session) => {
    if (session) {
      state.checkingAccess = true; render();
      const { authorized, isAdmin } = await checkAccess(session.user.email);
      state.checkingAccess = false;
      if (!authorized) {
        state.loginError = "A conta " + (session.user.email || "") + " não está autorizada a acessar este sistema. Fale com o administrador para liberar seu acesso.";
        state.session = null;
        render();
        await sb.auth.signOut();
        return;
      }
      state.loginError = "";
      state.isAdmin = isAdmin;
    } else {
      state.isAdmin = false;
    }
    state.session = session;
    if (state.session) warmStartFromCache();
    render();
    if (session) { await bootstrapData(); startIdleWatcher(); }
    else clearTimeout(idleTimer);
  });
}

/* =====================================================================
   LOGOUT AUTOMATICO POR INATIVIDADE (20 minutos)
   ===================================================================== */
const IDLE_LIMIT_MS = 20 * 60 * 1000;
let idleTimer = null;
let idleWatcherStarted = false;
function resetIdleTimer() {
  if (!state.session) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (state.session) handleLogout();
  }, IDLE_LIMIT_MS);
}
function startIdleWatcher() {
  if (idleWatcherStarted) { resetIdleTimer(); return; }
  idleWatcherStarted = true;
  ["mousedown", "mousemove", "keydown", "scroll", "touchstart", "click"].forEach((evt) => {
    document.addEventListener(evt, resetIdleTimer, { passive: true });
  });
  resetIdleTimer();
}
async function bootstrapData() {
  await Promise.all([fetchMembers(), fetchVinculos(), fetchAgenda(), fetchFamilias()]);
  await ensureDefaultAcolher();
}
async function handleGoogleLogin() {
  state.loggingIn = true; state.loginError = ""; render();
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.origin + window.location.pathname },
  });
  if (error) {
    state.loggingIn = false;
    state.loginError = error.message || "Não foi possível iniciar o login com Google.";
    render();
  }
  // Em caso de sucesso o navegador é redirecionado ao Google; ao voltar,
  // onAuthStateChange assume a sessão automaticamente.
}
async function handleLogout() { clearTimeout(idleTimer); await sb.auth.signOut(); }


/* =====================================================================
   CACHE LOCAL (deixa a tela pintar na hora com o último dado conhecido
   enquanto busca a versão atualizada no Supabase em segundo plano)
   ===================================================================== */
const CACHE_PREFIX = "gm_cache_";
const CACHE_VERSION = "v1";
function cacheKey(name) { return CACHE_PREFIX + name + "_" + CACHE_VERSION; }
function loadCache(name) {
  try {
    const raw = localStorage.getItem(cacheKey(name));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveCache(name, data) {
  try { localStorage.setItem(cacheKey(name), JSON.stringify(data)); } catch (e) { /* quota cheia ou indisponivel: ignora */ }
}
function warmStartFromCache() {
  const cachedMembers = loadCache("members");
  if (cachedMembers) { state.members = cachedMembers; state.loadingMembers = false; }
  const cachedFamilias = loadCache("familias");
  if (cachedFamilias) { state.familias = cachedFamilias; state.loadingFamilias = false; }
}

   ===================================================================== */
async function fetchMembers() {
  state.loadingMembers = state.members.length === 0; render();
  const { data, error } = await sb.from(TABLE).select("*").order("nome_completo", { ascending: true });
  state.loadingMembers = false;
  if (error) { if (state.members.length === 0) showToast("Erro ao carregar membros: " + error.message, true); }
  else {
    state.members = (data || []).map((m) => ({
      ...m,
      membresia_igreja: normalizeIgreja(m.membresia_igreja),
      situacao_membro: normalizeSituacao(m.situacao_membro),
      status_membro: normalizeTipoMembro(m.status_membro),
      recebido_por: normalizeRecebidoPor(m.recebido_por),
      sexo: normalizeSexo(m.sexo),
    }));
    saveCache("members", state.members);
  }
  render();
}
async function saveMember(payload, id) {
  state.saving = true; render();
  let error;
  if (id) ({ error } = await sb.from(TABLE).update(payload).eq("id", id));
  else ({ error } = await sb.from(TABLE).insert(payload));
  state.saving = false;
  if (error) { showToast("Erro ao salvar: " + error.message, true); render(); return false; }
  showToast(id ? "Membro atualizado." : "Membro cadastrado.");
  state.modalOpen = false; state.editingMember = null;
  await fetchMembers();
  await ensureDefaultAcolher();
  return true;
}
function requestDeleteMember(id, name) {
  if (!state.isAdmin) {
    showToast("Apenas administradores podem excluir membros.", true);
    return;
  }
  state.deleteConfirm = { id, name, confirmText: "", error: "" };
  render();
}
function closeDeleteConfirm() { state.deleteConfirm = null; render(); }
async function confirmDeleteMember() {
  const dc = state.deleteConfirm;
  if (!dc) return;
  if ((dc.confirmText || "").trim().toUpperCase() !== "EXCLUIR") {
    dc.error = 'Digite "EXCLUIR" para confirmar.';
    render();
    return;
  }
  await deleteMember(dc.id, dc.name);
  state.deleteConfirm = null;
  render();
}
async function deleteMember(id, name) {
  const { error } = await sb.from(TABLE).delete().eq("id", id);
  if (error) { showToast("Erro ao excluir: " + error.message, true); return; }
  showToast("Membro excluido.");
  fetchMembers();
}

/* =====================================================================
   DUPLICADOS
   ===================================================================== */
function getDuplicateGroups() {
  const map = {};
  state.members.forEach((m) => {
    const key = normalizeName(m.nome_completo);
    if (!key) return;
    if (!map[key]) map[key] = [];
    map[key].push(m);
  });
  return Object.values(map).filter((g) => g.length > 1);
}

/* =====================================================================
   DADOS — VINCULOS (MINISTERIOS / PROCESSOS)
   ===================================================================== */
async function fetchVinculos() {
  state.loadingVinculos = true; render();
  const [minRes, procRes] = await Promise.all([
    sb.from(MIN_TABLE).select("*"),
    sb.from(PROC_TABLE).select("*"),
  ]);
  state.loadingVinculos = false;
  if (minRes.error) showToast("Erro ao carregar ministerios: " + minRes.error.message, true);
  else state.vinculosMinisterios = minRes.data || [];
  if (procRes.error) showToast("Erro ao carregar processos: " + procRes.error.message, true);
  else state.vinculosProcessos = procRes.data || [];
  render();
}
async function ensureDefaultAcolher() {
  const withProcess = new Set(state.vinculosProcessos.map((v) => v.membro_id));
  const missing = state.members.filter((m) => !withProcess.has(m.id));
  if (missing.length === 0) return;
  const rows = missing.map((m) => ({ membro_id: m.id, processo: "Acolher" }));
  const { data, error } = await sb.from(PROC_TABLE).insert(rows).select();
  if (error) { showToast("Erro ao definir Acolher padrao: " + error.message, true); return; }
  state.vinculosProcessos = state.vinculosProcessos.concat(data || []);
  render();
}
async function toggleVinculo(tipo, membroId, valor, checked) {
  const table = tipo === "ministerio" ? MIN_TABLE : PROC_TABLE;
  const col = tipo === "ministerio" ? "ministerio" : "processo";
  if (checked) {
    const { data, error } = await sb.from(table).insert({ membro_id: membroId, [col]: valor }).select().single();
    if (error) { showToast("Erro ao vincular: " + error.message, true); return; }
    if (tipo === "ministerio") state.vinculosMinisterios.push(data); else state.vinculosProcessos.push(data);
  } else {
    const { error } = await sb.from(table).delete().eq("membro_id", membroId).eq(col, valor);
    if (error) { showToast("Erro ao remover: " + error.message, true); return; }
    if (tipo === "ministerio") state.vinculosMinisterios = state.vinculosMinisterios.filter((v) => !(v.membro_id === membroId && v.ministerio === valor));
    else state.vinculosProcessos = state.vinculosProcessos.filter((v) => !(v.membro_id === membroId && v.processo === valor));
  }
  render();
}

  const ageCounts = bands.map((b) => ({ ...b, count: list.filter((m) => { const age = getAge(m.dt_nascimento); return age !== null && age >= b.min && age <= b.max; }).length }));
  const maxAge = Math.max(1, ...ageCounts.map((b) => b.count));

  const porIgreja = IGREJAS.map((ig) => ({ nome: ig, count: list.filter((m) => m.membresia_igreja === ig).length }));

  const anos = [];
  for (let y = 2021; y <= year; y++) anos.push(y);
  // Base: membros sem data de entrada registrada são considerados parte do total já existente antes do início do controle (2021).
  const semDataEntrada = list.filter((m) => !m.dt_entrada).length;
  const cumulativeUntil = (y) => semDataEntrada + list.filter((m) => m.dt_entrada && new Date(m.dt_entrada).getFullYear() <= y).length;
  const porAno = anos.map((y) => {
    const count = list.filter((m) => m.dt_entrada && new Date(m.dt_entrada).getFullYear() === y).length;
    const prevTotal = cumulativeUntil(y - 1);
    let growth = null;
    if (prevTotal > 0) growth = (count / prevTotal) * 100;
    else if (count > 0) growth = "novo";
    return { ano: y, count, growth };
  });
  const maxAno = Math.max(1, ...porAno.map((b) => b.count));

  return { total, ativos, inativos, homens, mulheres, novos, ageCounts, maxAge, porIgreja, porAno, maxAno };
}

/* =====================================================================
   EXPORTAR EXCEL
   ===================================================================== */
function loadXLSXLib() {
  if (window.XLSX) return Promise.resolve();
  if (window.__xlsxLoadingPromise) return window.__xlsxLoadingPromise;
  window.__xlsxLoadingPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Falha ao carregar biblioteca de planilhas."));
    document.head.appendChild(s);
  });
  return window.__xlsxLoadingPromise;
}
async function exportXLSX() {
  try {
    await loadXLSXLib();
  } catch (e) {
    showToast("Não foi possível carregar o exportador. Verifique sua conexão.");
    return;
  }
  const list = getFilteredMembers();
  const rows = list.map((m) => { const row = {}; FIELDS.forEach((f) => { row[f.label] = m[f.key] ?? ""; }); return row; });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Membros");
  XLSX.writeFile(wb, "membros_" + new Date().toISOString().slice(0, 10) + ".xlsx");
}

                "<td>" + contato + "</td>" +
                '<td><span class="status-pill ' + (isAtivo ? "is-ativo" : "is-inativo") + '"><span class="dot"></span>' + esc(m.situacao_membro || "—") + "</span></td>" +
                '<td><div class="action-icons">' +
                  '<button class="action-icon-btn edit btn-edit" data-id="' + m.id + '" title="Editar membro" aria-label="Editar">' + ICON_SVG.pencil + "</button>" +
                  (state.isAdmin ? '<button class="action-icon-btn delete btn-delete" data-id="' + m.id + '" data-name="' + esc(m.nome_completo || "") + '" title="Excluir membro" aria-label="Excluir">' + ICON_SVG.trash + "</button>" : "") +
                "</div></td>" +
              "</tr>"
            );
          }).join("") + "</tbody></table></div>" +
          renderTablePager(filtered.length, totalCount, pageStart, pageItems.length, totalPages)) +
    "</div>"
  );
}
function renderTablePager(filteredCount, totalCount, pageStart, pageItemsLen, totalPages) {
  const from = filteredCount === 0 ? 0 : pageStart + 1;
  const to = pageStart + pageItemsLen;
  const page = state.tablePage;
  const pageBtns = [];
  const addPage = (p) => pageBtns.push('<button type="button" class="pager-page ' + (p === page ? "active" : "") + '" data-page="' + p + '">' + p + "</button>");
  const addEllipsis = () => pageBtns.push('<span class="pager-ellipsis">…</span>');
  if (totalPages <= 7) {
    for (let p = 1; p <= totalPages; p++) addPage(p);
  } else {
    addPage(1);
    if (page > 3) addEllipsis();
    for (let p = Math.max(2, page - 1); p <= Math.min(totalPages - 1, page + 1); p++) addPage(p);
    if (page < totalPages - 2) addEllipsis();
    addPage(totalPages);
  }
  return (
    '<div class="table-footer">' +
      '<div class="table-footer-count">Exibindo ' + from + '–' + to + ' de ' + filteredCount + " membros" + (filteredCount !== totalCount ? " (de " + totalCount + " no total)" : "") + "</div>" +
      '<div class="table-pager">' +
        '<button type="button" class="pager-btn" id="pager-prev" ' + (page <= 1 ? "disabled" : "") + " title=\"Página anterior\">" + ICON_SVG.chevronLeft + "</button>" +
        pageBtns.join("") +
        '<button type="button" class="pager-btn" id="pager-next" ' + (page >= totalPages ? "disabled" : "") + " title=\"Próxima página\">" + ICON_SVG.chevronRight + "</button>" +
      "</div>" +
    "</div>"
  );
}

function attachFamiliaModalListeners() {
  document.getElementById("fam-modal-close")?.addEventListener("click", closeFamiliaModal);
  document.getElementById("fam-modal-cancel")?.addEventListener("click", closeFamiliaModal);
  document.getElementById("fam-modal-backdrop")?.addEventListener("click", (e) => { if (e.target.id === "fam-modal-backdrop") closeFamiliaModal(); });
  const form = document.getElementById("familia-form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {
        nome_familia: String(fd.get("nome_familia") || "").trim(),
        endereco_familia: fd.get("endereco_familia") ? String(fd.get("endereco_familia")).trim() : null,
        bairro_familia: fd.get("bairro_familia") ? String(fd.get("bairro_familia")).trim() : null,
        lider_familia: fd.get("lider_familia") ? String(fd.get("lider_familia")).trim() : null,
        grupo_familia: fd.get("grupo_familia") ? String(fd.get("grupo_familia")).trim() : null,
      };
      if (!payload.nome_familia) { showToast("Informe o nome da família.", true); return; }
      saveFamilia(payload, state.famEditing && state.famEditing.id);
    });
  }
}
function attachFamiliasListeners() {
  const searchInput = document.getElementById("fam-search");
  if (searchInput) {
    searchInput.addEventListener("input", (e) => {
      state.famSearch = e.target.value;
      state.famSemLimit = 40;
      const pos = e.target.selectionStart;
      clearTimeout(window.__famSearchDebounce);
      window.__famSearchDebounce = setTimeout(() => {
        render();
        const el = document.getElementById("fam-search");
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
      }, 120);
    });
  }
  document.getElementById("btn-fam-sem-mais")?.addEventListener("click", () => { state.famSemLimit += 40; render(); });
  document.getElementById("btn-fam-new")?.addEventListener("click", () => openFamiliaModal(null));

  document.getElementById("fam-kpi-semfamilia")?.addEventListener("click", () => {
    state.famOnlySemFamilia = !state.famOnlySemFamilia;
    render();
    if (state.famOnlySemFamilia) document.getElementById("fam-sem-familia-panel")?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  document.getElementById("fam-clear-onlysemfamilia")?.addEventListener("click", () => { state.famOnlySemFamilia = false; render(); });

  document.getElementById("fam-igreja-add-btn")?.addEventListener("click", (e) => {
    e.stopPropagation();
    state.famIgrejaMenuOpen = !state.famIgrejaMenuOpen;
    render();
  });
  document.querySelectorAll("[data-igreja-opt]").forEach((chk) => chk.addEventListener("change", () => {
    const val = chk.dataset.igrejaOpt;
    const idx = state.famFilterIgrejas.indexOf(val);
    if (idx === -1) state.famFilterIgrejas.push(val); else state.famFilterIgrejas.splice(idx, 1);
    render();
  }));
  document.querySelectorAll("[data-remove-igreja]").forEach((btn) => btn.addEventListener("click", () => {
    const idx = state.famFilterIgrejas.indexOf(btn.dataset.removeIgreja);
    if (idx !== -1) state.famFilterIgrejas.splice(idx, 1);
    render();
  }));

  document.querySelectorAll("[data-fam-menu-toggle]").forEach((btn) => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const id = Number(btn.dataset.famMenuToggle);
    state.famMenuOpenId = state.famMenuOpenId === id ? null : id;
    render();
  }));
  document.querySelectorAll("[data-fam-menu-edit]").forEach((btn) => btn.addEventListener("click", () => {
    const f = state.familias.find((x) => x.id === Number(btn.dataset.famMenuEdit));
    if (f) openFamiliaModal(f);
  }));
  document.querySelectorAll("[data-fam-menu-addmember]").forEach((btn) => btn.addEventListener("click", () => {
    const f = state.familias.find((x) => x.id === Number(btn.dataset.famMenuAddmember));
    if (f) openAdicionarMembroFamilia(f);
  }));
  document.querySelectorAll("[data-fam-menu-visita]").forEach((btn) => btn.addEventListener("click", () => {
    const f = state.familias.find((x) => x.id === Number(btn.dataset.famMenuVisita));
    if (f) openAgendarVisitaFamilia(f);
  }));
  document.querySelectorAll("[data-fam-menu-delete]").forEach((btn) => btn.addEventListener("click", () => {
    state.famMenuOpenId = null;
    deleteFamilia(Number(btn.dataset.famMenuDelete), btn.dataset.nome);
  }));

  document.querySelectorAll(".fam-btn-unlink").forEach((btn) => btn.addEventListener("click", () => removeMemberFromFamilia(Number(btn.dataset.id))));
  document.querySelectorAll(".fam-btn-edit-member").forEach((btn) => btn.addEventListener("click", () => {
    state.editingMember = state.members.find((m) => String(m.id) === String(btn.dataset.id)) || null;
    state.modalOpen = true;
    render();
  }));
}

function agPillHtml(ev) {
  const cat = agCategoryInfo(ev.categoria);
  const time = fmtHorario(ev.horario);
  return '<span class="ag-pill" data-ag-pill="' + ev.id + '" style="--cat-color:' + cat.color + '" title="' + esc((time ? time + " — " : "") + ev.titulo) + '">' +
    (time ? '<span class="ag-pill-time">' + time + '</span>' : "") +
    '<span class="ag-pill-text">' + esc(ev.titulo) + '</span>' +
  '</span>';
}
function agWeekPillHtml(ev) {
  const cat = agCategoryInfo(ev.categoria);
  const time = fmtHorario(ev.horario);
  return '<span class="ag-week-pill" data-ag-pill="' + ev.id + '" style="--cat-color:' + cat.color + '">' +
    '<span class="ag-week-pill-text">' +
      (time ? '<span class="ag-week-pill-time">' + time + '</span>' : "") +
      '<span class="ag-week-pill-title">' + esc(ev.titulo) + '</span>' +
    '</span>' +
  '</span>';
}
function renderAgendaFlatCards(events, opts) {
  opts = opts || {};
  if (!events.length) return '<div class="empty-state">Nenhum evento neste período.</div>';
  return '<div class="ag-flat-list">' + events.map((ev) => {
    const d = new Date(ev.data_inicio + "T00:00:00");
    const cat = agCategoryInfo(ev.categoria);
    const time = fmtHorario(ev.horario);
    const isMultiDay = ev.data_fim && ev.data_fim !== ev.data_inicio;
    const timeText = (time ? time : "") + (time && isMultiDay ? " · " : "") + (isMultiDay ? "até " + fmtDate(ev.data_fim) : "");
    const metaLine = (timeText || ev.categoria)
      ? '<div class="ag-card-meta">' +
          (timeText ? '<span class="ag-card-time">' + timeText + '</span>' : "") +
          (ev.categoria ? '<span class="ag-card-cat">' + esc(cat.label) + '</span>' : "") +
        '</div>'
      : "";
    return (
      '<div class="ag-card" style="--cat-color:' + cat.color + '">' +
        '<div class="ag-card-date">' +
          '<div class="ag-card-date-day">' + d.getDate() + '</div>' +
          '<div class="ag-card-date-wd">' + DIAS_SEMANA[d.getDay()] + '</div>' +
          (opts.showMonth ? '<div class="ag-card-date-mo">' + MESES[d.getMonth()].slice(0, 3) + '</div>' : "") +
        '</div>' +
        '<div class="ag-card-body">' +
          metaLine +
          '<div class="ag-card-title-row"><span class="ag-card-title">' + esc(ev.titulo) + '</span></div>' +
          (ev.descricao ? '<div class="ag-card-desc">' + esc(ev.descricao) + '</div>' : "") +
        '</div>' +
        '<div class="ag-card-actions gm-noprint">' +
          '<button class="action-icon-btn edit btn-edit-event" data-id="' + ev.id + '" title="Editar evento" aria-label="Editar evento">' + ICON_SVG.pencil + '</button>' +
          '<button class="action-icon-btn delete btn-delete-event" data-id="' + ev.id + '" data-titulo="' + esc(ev.titulo) + '" title="Excluir evento" aria-label="Excluir evento">' + ICON_SVG.trash + '</button>' +
        '</div>' +
      '</div>'
    );
  }).join("") + '</div>';
}
function renderAgendaTab() {
  const year = state.agFilterYear;
  const month = state.agFilterMonth;
  const view = state.agView || "month";
  const today = new Date();
  const todayISO = dateToISO(today);

  const monthEvents = getAgendaEventsForMonth();
  const yearEvents = getAgendaEventsForYear();
  const listEvents = state.agShowFullYear ? yearEvents : monthEvents;

  const anoAtualAg = today.getFullYear();
  const anos = [];
  for (let y = 2021; y <= anoAtualAg + 1; y++) anos.push(y);

  const header =
    '<div class="topbar">' +
      '<div><h2 class="page-title">Agendamentos</h2><p class="page-sub">Calendário de eventos e comentários da igreja.</p></div>' +
      '<div class="ag-header-actions gm-noprint">' +
        '<div class="ag-view-switch">' +
          ["month", "week", "list"].map((v) =>
            '<button type="button" class="ag-view-btn ' + (view === v ? "active" : "") + '" data-ag-view="' + v + '">' +
              (v === "month" ? "Mês" : v === "week" ? "Semana" : "Lista") +
            "</button>"
          ).join("") +
        "</div>" +
        '<button id="btn-toggle-year" class="btn btn-ghost btn-sm">' + (state.agShowFullYear ? "Voltar ao mês" : "Listar ano") + "</button>" +
        '<button id="btn-print-agenda" class="btn btn-ghost btn-sm" ' + (listEvents.length === 0 ? "disabled" : "") + ">Imprimir / PDF</button>" +
        '<button id="btn-new-event" class="btn btn-gold btn-sm">+ Novo evento</button>' +
      "</div>" +
    "</div>";

  // ---- barra de navegação unificada (compartilhada entre Mês/Semana) ----
  let navLabel = "";
  if (view === "week") {
    const anchor = state.agWeekAnchor ? new Date(state.agWeekAnchor + "T00:00:00") : today;
    const wStart = getWeekStart(anchor);
    const wEnd = new Date(wStart); wEnd.setDate(wStart.getDate() + 6);
    navLabel = wStart.getMonth() === wEnd.getMonth()
      ? wStart.getDate() + " – " + wEnd.getDate() + " de " + MESES[wStart.getMonth()] + " de " + wStart.getFullYear()
      : wStart.getDate() + " " + MESES[wStart.getMonth()].slice(0, 3) + " – " + wEnd.getDate() + " " + MESES[wEnd.getMonth()].slice(0, 3) + " de " + wEnd.getFullYear();
  }
  const agLegend = '<div class="ag-legend gm-noprint">' + AG_CATEGORIAS.map((c) => '<span class="ag-legend-item"><span class="ag-legend-dot" style="--cat-color:' + c.color + '"></span>' + c.label + "</span>").join("") + "</div>";
  const calNav =
    '<div class="cal-nav gm-noprint">' +
      '<div class="cal-nav-left">' +
        '<div class="cal-nav-arrows">' +
          '<button type="button" class="cal-nav-arrow" id="cal-nav-prev" title="Anterior" aria-label="Anterior">' + ICON_SVG.chevronLeft + "</button>" +
          '<button type="button" class="cal-nav-arrow" id="cal-nav-next" title="Próximo" aria-label="Próximo">' + ICON_SVG.chevronRight + "</button>" +
        "</div>" +
        (view === "week"
          ? '<span class="cal-nav-range">' + navLabel + "</span>"
          : '<span class="cal-nav-label">' +
              '<select id="ag-filter-month" class="gm-select">' + MESES.map((m, i) => '<option value="' + (i + 1) + '" ' + (month === i + 1 ? "selected" : "") + ">" + m + "</option>").join("") + "</select>" +
              '<select id="ag-filter-year" class="gm-select">' + anos.map((y) => '<option value="' + y + '" ' + (year === y ? "selected" : "") + ">" + y + "</option>").join("") + "</select>" +
            "</span>") +
        '<button type="button" class="btn btn-ghost btn-sm" id="cal-nav-today">Hoje</button>' +
        (view === "month" && state.agSelectedDay ? '<button id="btn-clear-day" class="btn btn-ghost btn-sm cal-nav-clear">Limpar seleção</button>' : "") +
      "</div>" +
      agLegend +
    "</div>";

  // ---- painel principal (Mês / Semana / vazio em Lista) ----
  let mainPanel = "";
  if (view === "week") {
    const anchor = state.agWeekAnchor ? new Date(state.agWeekAnchor + "T00:00:00") : today;
    const wStart = getWeekStart(anchor);
    let cols = "";
    for (let i = 0; i < 7; i++) {
      const d = new Date(wStart); d.setDate(wStart.getDate() + i);
      const iso = dateToISO(d);
      const dayEvents = sortEventsByTime(state.agenda.filter((ev) => eventCoversDate(ev, d)));
      const isToday = iso === todayISO;
      cols +=
        '<div class="ag-week-col">' +
          '<div class="ag-week-col-head"><div class="ag-week-col-weekday">' + DIAS_SEMANA[d.getDay()] + "</div>" +
            '<div class="ag-week-col-num' + (isToday ? " today" : "") + '">' + d.getDate() + "</div></div>" +
          '<div class="ag-week-col-body">' +
            (dayEvents.length ? dayEvents.map(agWeekPillHtml).join("") : '<div class="ag-week-empty">—</div>') +
          "</div>" +
        "</div>";
    }
    mainPanel = '<div class="panel ag-panel-shadow">' + calNav + '<div class="ag-week-grid">' + cols + "</div></div>";
  } else if (view !== "list") {
    const first = new Date(year, month - 1, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(year, month, 0).getDate();
    const prevMonthDays = new Date(year, month - 1, 0).getDate();
    const cellsArr = [];
    for (let i = startWeekday - 1; i >= 0; i--) cellsArr.push({ day: prevMonthDays - i, other: true, dateObj: new Date(year, month - 2, prevMonthDays - i) });
    for (let d = 1; d <= daysInMonth; d++) cellsArr.push({ day: d, other: false, dateObj: new Date(year, month - 1, d) });
    const remainder = (7 - (cellsArr.length % 7)) % 7;
    for (let d = 1; d <= remainder; d++) cellsArr.push({ day: d, other: true, dateObj: new Date(year, month, d) });

    let cells = "";
    cellsArr.forEach((c) => {
      const iso = dateToISO(c.dateObj);
      const dayEvents = sortEventsByTime(state.agenda.filter((ev) => eventCoversDate(ev, c.dateObj)));
      const has = dayEvents.length > 0;
      const shown = dayEvents.slice(0, 3);
      const extra = dayEvents.length - shown.length;
      const isToday = iso === todayISO;
      const isSelected = !c.other && state.agSelectedDay === c.day;
      cells +=
        '<button type="button" class="cal-cell-flat' + (c.other ? " other-month" : "") + (isSelected ? " selected" : "") + '"' +
          (c.other ? "" : ' data-day="' + c.day + '"') + ">" +
          '<span class="cal-cell-num' + (isToday ? " cal-cell-num-today" : "") + '">' + c.day + "</span>" +
          (has
            ? '<span class="cal-cell-pills">' +
                shown.map(agPillHtml).join("") +
                (extra > 0 ? '<span class="cal-cell-more">+' + extra + " mais</span>" : "") +
              "</span>"
            : "") +
        "</button>";
    });
    mainPanel =
      '<div class="panel ag-panel-shadow">' +
        calNav +
        '<div class="cal-weekdays-flat">' + DIAS_SEMANA.map((d) => '<div class="cal-weekday-flat">' + d + "</div>").join("") + "</div>" +
        '<div class="cal-grid-flat">' + cells + "</div>" +
      "</div>";
  }

  // ---- painel lateral: "Eventos do mês" ----
  const sidePanel =
    '<div class="panel ag-panel-shadow">' +
      '<div class="panel-head"><span class="ag-panel-title">' + (state.agShowFullYear ? "Eventos de " + year : "Eventos do mês") + '</span> <span class="badge badge-off ag-panel-count">' + listEvents.length + "</span></div>" +
      '<div class="print-target">' +
        '<div class="print-header"><h3 class="ag-print-title">' + (state.agShowFullYear ? "Eventos de " + year : "Eventos de " + MESES[month - 1] + " de " + year) + "</h3></div>" +
        (state.loadingAgenda ? '<div class="empty-state">Carregando…</div>' : renderAgendaFlatCards(listEvents, { showMonth: state.agShowFullYear })) +
      "</div>" +
    "</div>";

  const shellClass = "ag-shell" + (view === "list" ? " list-mode" : "");
  const body = '<div class="' + shellClass + '">' + (view === "list" ? "" : mainPanel) + sidePanel + "</div>";

  return header + body;
}
function agShiftMonth(delta) {
  let m = state.agFilterMonth + delta;
  let y = state.agFilterYear;
  if (m < 1) { m = 12; y -= 1; } else if (m > 12) { m = 1; y += 1; }
  state.agFilterMonth = m; state.agFilterYear = y; state.agSelectedDay = null;
}

  document.getElementById("btn-clear-day")?.addEventListener("click", () => { state.agSelectedDay = null; render(); });

  document.getElementById("btn-print-agenda")?.addEventListener("click", () => window.print());

  document.getElementById("cal-nav-prev")?.addEventListener("click", () => {
    if (state.agView === "week") {
      const anchor = state.agWeekAnchor ? new Date(state.agWeekAnchor + "T00:00:00") : new Date();
      anchor.setDate(anchor.getDate() - 7);
      state.agWeekAnchor = dateToISO(anchor);
    } else agShiftMonth(-1);
    render();
  });
  document.getElementById("cal-nav-next")?.addEventListener("click", () => {
    if (state.agView === "week") {
      const anchor = state.agWeekAnchor ? new Date(state.agWeekAnchor + "T00:00:00") : new Date();
      anchor.setDate(anchor.getDate() + 7);
      state.agWeekAnchor = dateToISO(anchor);
    } else agShiftMonth(1);
    render();
  });
  document.querySelectorAll(".cal-cell-flat[data-day]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const day = Number(btn.dataset.day);
      state.agSelectedDay = state.agSelectedDay === day ? null : day;
      render();
    });
  });
  document.querySelectorAll("[data-ag-pill]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      state.agEditing = state.agenda.find((ev) => String(ev.id) === String(el.dataset.agPill)) || null;
      state.agModalOpen = true;
      render();
    });
  });
  document.getElementById("btn-new-event")?.addEventListener("click", () => {
    state.agEditing = null;
    state.agModalOpen = true;
    render();
  });
  document.querySelectorAll(".btn-edit-event").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.agEditing = state.agenda.find((ev) => String(ev.id) === String(btn.dataset.id)) || null;
      state.agModalOpen = true;
      render();
    });
  });
  document.querySelectorAll(".btn-delete-event").forEach((btn) => {
    btn.addEventListener("click", () => deleteAgendaEvent(btn.dataset.id, btn.dataset.titulo));
  });
}
function renderAgendaModal() {
  const ev = state.agEditing || {};
  const isEdit = !!ev.id;
  let defaultStart = "";
  if (!isEdit && state.agSelectedDay && state.agView !== "week") {
    defaultStart = state.agFilterYear + "-" + pad2(state.agFilterMonth) + "-" + pad2(state.agSelectedDay);
  }
  return (
    '<div class="modal-backdrop" id="ag-modal-backdrop"><div class="modal">' +
      '<div class="modal-head"><h3>' + (isEdit ? "Editar evento" : "Novo evento") + '</h3><button class="modal-close" id="ag-modal-close">&times;</button></div>' +
      '<form id="agenda-form"><div class="modal-body"><div class="form-grid">' +
        '<div class="field full"><label for="ag-fld-titulo">Título *</label><input id="ag-fld-titulo" name="titulo" type="text" value="' + esc(ev.titulo || "") + '" required data-upper="1" /></div>' +
        '<div class="field"><label for="ag-fld-categoria">Categoria</label><select id="ag-fld-categoria" name="categoria"><option value="">Sem categoria</option>' +
          AG_CATEGORIAS.map((c) => '<option value="' + c.key + '" ' + (ev.categoria === c.key ? "selected" : "") + ">" + c.label + "</option>").join("") +
        "</select></div>" +
        '<div class="field"><label for="ag-fld-inicio">Data de início *</label><input id="ag-fld-inicio" name="data_inicio" type="date" value="' + esc(ev.data_inicio || defaultStart) + '" required /></div>' +
        '<div class="field"><label for="ag-fld-horario">Horário</label><input id="ag-fld-horario" name="horario" type="time" value="' + esc(fmtHorario(ev.horario)) + '" /></div>' +
        '<div class="field"><label for="ag-fld-fim">Data de fim (opcional, se for mais de um dia)</label><input id="ag-fld-fim" name="data_fim" type="date" value="' + esc(ev.data_fim || "") + '" /></div>' +
        '<div class="field full"><label for="ag-fld-descricao">Comentário</label><textarea id="ag-fld-descricao" name="descricao" rows="4" data-upper="1" style="width:100%; padding:11px 13px; border:1px solid var(--line-2); border-radius:9px; font-size:14px; background:var(--cream); color:var(--ink); font-family:inherit; resize:vertical;">' + esc(ev.descricao || "") + "</textarea></div>" +
      "</div></div>" +
      '<div class="modal-foot"><button type="button" class="btn btn-ghost" id="ag-modal-cancel">Cancelar</button><button type="submit" class="btn btn-gold" ' + (state.agSaving ? "disabled" : "") + ">" + (state.agSaving ? "Salvando…" : "Salvar") + "</button></div></form>" +
    "</div></div>"
  );
}
function attachAgendaModalListeners() {
  document.getElementById("ag-modal-close")?.addEventListener("click", closeAgendaModal);
  document.getElementById("ag-modal-cancel")?.addEventListener("click", closeAgendaModal);
  document.getElementById("ag-modal-backdrop")?.addEventListener("click", (e) => { if (e.target.id === "ag-modal-backdrop") closeAgendaModal(); });
  const form = document.getElementById("agenda-form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {
        titulo: toUpper(fd.get("titulo")),
        categoria: fd.get("categoria") || null,
        data_inicio: fd.get("data_inicio"),
        data_fim: fd.get("data_fim") || null,
        horario: fd.get("horario") || null,
        descricao: fd.get("descricao") ? toUpper(fd.get("descricao")) : null,
      };
      saveAgendaEvent(payload, state.agEditing && state.agEditing.id);
    });
  }
}
function closeAgendaModal() { state.agModalOpen = false; state.agEditing = null; render(); }

/* =====================================================================
   ABA: IMPRESSÃO
   ===================================================================== */
function renderImpressaoTab() {
  const list = getPrintMembers();
  const selectedFields = PRINT_FIELDS.filter((f) => state.printFields[f.key]);

  const filtrosResumo = [
    state.printFilterIgreja || "Todas as igrejas",
    state.printFilterSituacao.length ? state.printFilterSituacao.join("/") : "Todas as situações",
    state.printFilterTipo.length ? state.printFilterTipo.join("/") : "Todos os tipos",
    state.printIncluirMenores ? "Com menores de idade" : "Sem menores de idade",
  ].join(" · ");

  return (
    '<div class="topbar"><div><h2 class="page-title">Impressão</h2><p class="page-sub">Gere listas para assembleia ou controle, com os campos que precisar.</p></div></div>' +
    '<div class="panel gm-noprint">' +
      '<div class="panel-head">Filtros</div>' +
      '<div class="toolbar">' +
        '<select id="print-filter-igreja" class="gm-select"><option value="">Todas as igrejas</option>' + IGREJAS.map((i) => '<option value="' + esc(i) + '" ' + (state.printFilterIgreja === i ? "selected" : "") + ">" + esc(i) + "</option>").join("") + "</select>" +
      "</div>" +
      '<div class="toolbar">' +
        '<span class="filter-label">Situação:</span>' + renderChipGroup("print-situacao", ["Ativo", "Inativo"], state.printFilterSituacao) +
        '<span class="filter-label" style="margin-left:10px;">Tipo:</span>' + renderChipGroup("print-tipo", TIPOS_MEMBRO, state.printFilterTipo) +
      "</div>" +
      '<div class="toolbar">' +
        '<span class="filter-label">Menores de idade:</span>' +
        '<label class="switch-wrap"><input type="checkbox" id="print-toggle-menores" ' + (state.printIncluirMenores ? "checked" : "") + ' /><span class="switch-track"><span class="switch-thumb"></span></span>' +
        '<span class="switch-label">' + (state.printIncluirMenores ? "Incluindo menores de idade" : "Somente maiores de idade") + "</span></label>" +
      "</div>" +
      '<div class="panel-head" style="border-top:1px solid var(--line);">Campos a imprimir</div>' +
      '<div class="check-list">' + PRINT_FIELDS.map((f) => '<label class="check-row"><input type="checkbox" class="print-field-chk" data-key="' + f.key + '" ' + (state.printFields[f.key] ? "checked" : "") + " />" + esc(f.label) + "</label>").join("") + "</div>" +
      '<div class="toolbar" style="border-top:1px solid var(--line); border-bottom:none;">' +
        '<span class="sub-cell">' + list.length + " membro(s) correspondem aos filtros — " + filtrosResumo + "</span>" +
        '<div class="spacer"></div>' +
        '<button id="btn-print" class="btn btn-gold btn-sm" ' + (selectedFields.length === 0 ? "disabled" : "") + ">Imprimir / Salvar PDF</button>" +
      "</div>" +
    "</div>" +
    '<div class="panel">' +
      '<div class="print-target">' +
        '<div class="print-header"><h3>Lista de Membros</h3><p>' + filtrosResumo + " · Emitido em " + new Date().toLocaleDateString("pt-BR") + " · " + list.length + " membro(s)</p></div>" +
        (selectedFields.length === 0
          ? '<div class="empty-state">Selecione ao menos um campo para gerar a lista.</div>'
          : '<div class="table-scroll"><table class="print-table"><thead><tr><th style="width:36px;">#</th>' + selectedFields.map((f) => "<th>" + esc(f.label === "Assinatura (coluna em branco)" ? "Assinatura" : f.label) + "</th>").join("") + "</tr></thead><tbody>" +
            list.map((m, i) =>
              "<tr><td>" + (i + 1) + "</td>" +
              selectedFields.map((f) => {
                if (f.key === "assinatura") return '<td class="sig-cell">&nbsp;</td>';
                if (f.key === "telefone") return "<td>" + esc(m.celular || m.fone || "") + "</td>";
                if (f.key === "dt_nascimento") return "<td>" + fmtDate(m.dt_nascimento) + "</td>";
                if (f.key === "familia") return "<td>" + esc(getFamiliaNome(m) || "") + "</td>";
                return "<td>" + esc(m[f.key] || "") + "</td>";
              }).join("") + "</tr>"
            ).join("") + "</tbody></table></div>") +
      "</div>" +
    "</div>"
  );
}
function attachImpressaoListeners() {
  document.getElementById("print-filter-igreja")?.addEventListener("change", (e) => { state.printFilterIgreja = e.target.value; render(); });
  document.getElementById("print-toggle-menores")?.addEventListener("change", (e) => { state.printIncluirMenores = e.target.checked; render(); });
  document.querySelectorAll(".print-field-chk").forEach((chk) => chk.addEventListener("change", (e) => { state.printFields[chk.dataset.key] = e.target.checked; render(); }));
  document.getElementById("btn-print")?.addEventListener("click", () => window.print());
}

/* =====================================================================
   MODAL DE CADASTRO / EDIÇÃO
   ===================================================================== */
function renderModal() {
  const m = state.editingMember || {};
  const isEdit = !!m.id;
  const visibleFields = FIELDS.filter((f) => isEdit || !f.editOnly);
  const familiaAtual = getFamiliaNome(m);
  return (
    '<div class="modal-backdrop" id="modal-backdrop"><div class="modal">' +
      '<div class="modal-head"><h3>' + (isEdit ? "Editar membro" : "Novo membro") + '</h3><button class="modal-close" id="modal-close">&times;</button></div>' +
      '<form id="member-form"><div class="modal-body"><div class="form-grid">' + visibleFields.map((f) => renderField(f, m)).join("") +
        '<div class="field full">' +
          '<label for="fld-vincular-membro">Vincular a um membro da família (opcional)</label>' +
          '<input id="fld-vincular-membro" type="text" list="membros-familia-datalist" placeholder="Digite o nome de um cônjuge, filho(a) etc. já cadastrado" autocomplete="off" data-upper="1" />' +
          '<datalist id="membros-familia-datalist">' +
            state.members.filter((mb) => mb.id !== m.id).map((mb) => '<option value="' + esc(mb.nome_completo) + '">').join("") +
          "</datalist>" +
          (familiaAtual
            ? '<div class="sub-cell" style="margin-top:6px;">Já vinculado a: <strong>' + esc(familiaAtual) + '</strong>' + (isEdit ? ' · <button type="button" class="icon-btn" id="btn-remover-vinculo-familia" data-id="' + m.id + '" style="margin-left:6px;">Remover vínculo</button>' : "") + "</div>"
            : '<div class="sub-cell" style="margin-top:6px;">Nenhuma família vinculada ainda.</div>') +
        "</div>" +
        '<div class="field"><label for="fld-papel-familia">Papel na família</label><select id="fld-papel-familia"><option value="">—</option>' +
          PAPEL_FAMILIA_OPCOES.map((o) => '<option value="' + esc(o) + '" ' + (m.papel_familia === o ? "selected" : "") + ">" + esc(o) + "</option>").join("") +
        "</select></div>" +
      "</div></div>" +
      '<div class="modal-foot"><button type="button" class="btn btn-ghost" id="modal-cancel">Cancelar</button><button type="submit" class="btn btn-gold" ' + (state.saving ? "disabled" : "") + ">" + (state.saving ? "Salvando…" : "Salvar") + "</button></div></form>" +
    "</div></div>"
  );
}
function renderField(f, m) {
  const val = m[f.key] ?? "";
  const cls = f.full ? "field full" : "field";
  if (f.type === "select") {
    return '<div class="' + cls + '"><label for="fld-' + f.key + '">' + f.label + (f.required ? " *" : "") + "</label>" +
      '<select id="fld-' + f.key + '" name="' + f.key + '" ' + (f.required ? "required" : "") + '><option value=""></option>' +
      f.options.map((o) => '<option value="' + esc(o) + '" ' + (val === o ? "selected" : "") + ">" + esc(o) + "</option>").join("") + "</select></div>";
  }
  const upperAttr = (f.type === "text" || f.type === "email") ? ' data-upper="1"' : "";
  return '<div class="' + cls + '"><label for="fld-' + f.key + '">' + f.label + (f.required ? " *" : "") + '</label><input id="fld-' + f.key + '" name="' + f.key + '" type="' + f.type + '" value="' + esc(val) + '" ' + (f.required ? "required" : "") + upperAttr + " /></div>";
}
function attachModalListeners() {
  document.getElementById("modal-close")?.addEventListener("click", closeModal);
  document.getElementById("modal-cancel")?.addEventListener("click", closeModal);
  document.getElementById("modal-backdrop")?.addEventListener("click", (e) => { if (e.target.id === "modal-backdrop") closeModal(); });
  document.getElementById("btn-remover-vinculo-familia")?.addEventListener("click", (e) => { removeMemberFromFamilia(Number(e.target.dataset.id)); closeModal(); });
  const form = document.getElementById("member-form");
  if (form) {
    const isEdit = !!(state.editingMember && state.editingMember.id);
    const visibleFields = FIELDS.filter((f) => isEdit || !f.editOnly);
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {};
      visibleFields.forEach((f) => { let v = fd.get(f.key); if (v === "") v = null; if (v !== null && (f.type === "text" || f.type === "email")) v = toUpper(v); payload[f.key] = v; });
      const vinculoNome = toUpper(document.getElementById("fld-vincular-membro")?.value || "");
      const papelFamilia = document.getElementById("fld-papel-familia")?.value || "";
      saveMemberComFamilia(payload, vinculoNome, papelFamilia, state.editingMember && state.editingMember.id);
    });
  }
}
function closeModal() { state.modalOpen = false; state.editingMember = null; render(); }

/* =====================================================================
   MODAL DE CONFIRMAÇÃO DE EXCLUSÃO (exige senha do login administrador)
   ===================================================================== */
function renderDeleteConfirmModal() {
  const dc = state.deleteConfirm;
  return (
    '<div class="modal-backdrop" id="delconfirm-backdrop"><div class="modal" style="max-width:420px;">' +
      '<div class="modal-head"><h3>Confirmar exclusão</h3><button class="modal-close" id="delconfirm-close">&times;</button></div>' +
      '<form id="delconfirm-form"><div class="modal-body">' +
        '<p style="margin:0 0 16px;color:var(--slate);font-size:14px;">Para excluir <strong>' + esc(dc.name) + '</strong> da base de membros, digite <strong>EXCLUIR</strong> abaixo. Essa ação não pode ser desfeita.</p>' +
        '<div class="field full">' +
          '<label for="delconfirm-text">Digite EXCLUIR para confirmar</label>' +
          '<input id="delconfirm-text" type="text" autocomplete="off" autofocus required value="' + esc(dc.confirmText || "") + '" />' +
        "</div>" +
        (dc.error ? '<p style="margin:8px 0 0;color:var(--danger);font-size:13px;">' + esc(dc.error) + "</p>" : "") +
      "</div>" +
      '<div class="modal-foot"><button type="button" class="btn btn-ghost" id="delconfirm-cancel">Cancelar</button><button type="submit" class="btn btn-gold" style="background:var(--danger);border-color:var(--danger);">Excluir</button></div>' +
      "</form>" +
    "</div></div>"
  );
}
function attachDeleteConfirmListeners() {
  document.getElementById("delconfirm-close")?.addEventListener("click", closeDeleteConfirm);
  document.getElementById("delconfirm-cancel")?.addEventListener("click", closeDeleteConfirm);
  document.getElementById("delconfirm-backdrop")?.addEventListener("click", (e) => { if (e.target.id === "delconfirm-backdrop") closeDeleteConfirm(); });
  const textInput = document.getElementById("delconfirm-text");
  if (textInput) textInput.focus();
  const form = document.getElementById("delconfirm-form");
  if (form) form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (state.deleteConfirm) state.deleteConfirm.confirmText = textInput ? textInput.value : "";
    confirmDeleteMember();
  });
}

/* =====================================================================
   RENDER ROOT
   ===================================================================== */
function render() {
  if (state.loadingSession) { root.innerHTML = '<div class="loading-wrap">Carregando…</div>'; return; }
  if (state.checkingAccess) { root.innerHTML = '<div class="loading-wrap">Verificando acesso…</div>'; return; }
  if (!state.session) { renderLogin(); return; }
  let body = "";
  if (state.activeTab === "dashboard") body = renderDashboardTab();
  else if (state.activeTab === "tabela") body = renderTabelaTab();
  else if (state.activeTab === "ministerios") body = renderMinisteriosTab();
  else if (state.activeTab === "familias") body = renderFamiliasTab();
  else if (state.activeTab === "agendamentos") body = renderAgendaTab();
  else body = renderImpressaoTab();
  renderShell(body);
}

// Fecha o menu de contexto de uma família e o painel de seleção de unidades/igrejas
// (aba Famílias) ao clicar fora deles. Registrado uma única vez — não a cada render.
document.addEventListener("click", (e) => {
  if (state.famMenuOpenId !== null && !e.target.closest(".fam-menu-wrap")) { state.famMenuOpenId = null; render(); }
  if (state.famIgrejaMenuOpen && !e.target.closest(".fam-tag-filter")) { state.famIgrejaMenuOpen = false; render(); }
});

initAuth();
</script>
</body>
</html>
